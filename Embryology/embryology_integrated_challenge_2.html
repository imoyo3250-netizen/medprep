main{max-width:980px;margin:20px auto;padding:0 14px 42px}.toolbar{position:sticky;top:0;z-index:5;background:rgba(243,245,248,.96);backdrop-filter:blur(8px);padding:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

<script>
const BANK = [{"q": "A blastocyst with intact lineage allocation may nevertheless fail to implant when the maternal surface presents a temporally inappropriate adhesion phenotype.", "a": true, "e": "Implantation requires a developmentally competent blastocyst and a hormonally prepared endometrium. Abnormality in either partner can compromise apposition, adhesion or invasion.", "s": "Langman, 12th ed., Ch. 3, uterus at time of implantation; Moore, The Developing Human."}, {"q": "Two conceptuses with the same diploid chromosome count may differ in developmental competence when parent-of-origin marks are not equivalently represented, despite numerical restoration of diploidy.", "a": true, "e": "Genomic imprinting produces parent-of-origin-specific gene expression. Equal chromosome counts do not mean the two parental genomes are functionally interchangeable.", "s": "Langman, 12th ed., Ch. 2, chromosome theory of inheritance; standard genetics."}, {"q": "The junctional architecture that establishes epithelial sealing in the outer blastomere population is functionally interchangeable with the communication apparatus operating between inner blastomeres.", "a": false, "e": "Tight junctions regulate paracellular permeability and help maintain the blastocyst cavity. Gap junctions permit communication between cells; they are not interchangeable structures.", "s": "Langman, 12th ed., Ch. 3, cleavage and blastocyst formation; Alberts, Molecular Biology of the Cell."}, {"q": "A genital ridge may undergo substantial somatic differentiation despite inadequate colonisation by the lineage that ultimately supplies its gametes.", "a": true, "e": "Primordial germ cells arise from epiblast-associated precursors and migrate through the hindgut/dorsal mesentery region to the genital ridges. Failure of migration can impair germ-cell colonisation.", "s": "Langman, 12th ed., Ch. 2, primordial germ cells; Moore, The Developing Human, genital system."}, {"q": "A spermatozoon may contribute an organising centrosomal element to the zygote without contributing a centrosome equivalent to the mature somatic-cell pair.", "a": true, "e": "The sperm contributes the paternal genome and centrosomal components important for early spindle organisation; much of the sperm membrane and acrosomal material does not become a persistent component of the embryo.", "s": "Moore, The Developing Human, fertilization; standard cell biology."}, {"q": "The size of the ovulatory cohort cannot be inferred from the number of follicles that escape atresia, even though both processes are consequences of the same finite prenatal germ-cell pool.", "a": true, "e": "Most follicles undergo atresia; only a small fraction reach ovulation. The ovarian reserve is progressively depleted from fetal life onward.", "s": "Langman, 12th ed., Ch. 2, oogenesis; standard reproductive physiology."}, {"q": "The diversity attributable to meiotic chromosome orientation is generated at a different biological level from the diversity attributable to which two gametes happen to unite.", "a": true, "e": "Independent assortment distributes maternal and paternal homologues into gametes in different combinations. Random union of genetically distinct gametes creates further combinations in the zygote.", "s": "Langman, 12th ed., Ch. 2, chromosome theory of inheritance; standard genetics."}, {"q": "Paternal chromatin must undergo a biochemical transition after gamete fusion before it can participate in the same embryonic nuclear programme as maternal chromatin.", "a": true, "e": "Sperm chromatin is highly compacted by protamines. Following entry, oocyte factors promote chromatin remodelling and pronuclear formation.", "s": "Moore, The Developing Human, fertilization; standard reproductive cell biology."}, {"q": "The exocytotic event that modifies the oocyte's extracellular coat is initiated in the same gamete and at the same stage as the event that exposes sperm acrosomal contents.", "a": false, "e": "The acrosome reaction occurs in the sperm and facilitates penetration of the zona pellucida. The cortical reaction occurs in the oocyte after sperm–oocyte fusion and modifies the zona to reduce polyspermy.", "s": "Langman, 12th ed., Ch. 3, fertilization; Moore, The Developing Human, fertilization."}, {"q": "The zona pellucida has a temporally changing relationship with fertilisation, preimplantation transit and the acquisition of endometrial adhesiveness.", "a": true, "e": "The zona pellucida surrounds the early conceptus during cleavage and transit. Besides participating in sperm–oocyte recognition before fertilisation, it limits inappropriate adhesion before the embryo reaches the uterine cavity.", "s": "Langman, 12th ed., Ch. 3, fertilization, cleavage and blastocyst formation; Moore, The Developing Human, preimplantation development."}, {"q": "An invasive conceptus cannot be assumed to overcome a non-receptive endometrial surface merely by increasing the activity of its extracellular-matrix-degrading enzymes.", "a": true, "e": "Endometrial receptivity is temporally restricted and coordinated by ovarian steroids and local signalling. Proteolytic capacity does not make the endometrium uniformly receptive.", "s": "Langman, 12th ed., Ch. 3, uterus at time of implantation; standard reproductive endocrinology."}, {"q": "Artificial activation of an oocyte and restoration of the normal parent-specific genomic contribution are biologically equivalent events.", "a": false, "e": "Oocyte activation and cleavage initiation are separable from normal biparental inheritance. Mammalian development depends on parent-specific genomic contributions and imprinting.", "s": "Moore, The Developing Human, fertilization; standard genomic imprinting literature."}, {"q": "The sperm membrane domain exposed by acrosomal exocytosis is topologically identical to the domain that subsequently establishes continuity with the oolemma.", "a": false, "e": "During the acrosome reaction, the sperm plasma membrane over the acrosomal region fuses with the outer acrosomal membrane and vesiculates, exposing the inner acrosomal membrane. The sperm–oocyte fusion-competent region is associated with the equatorial segment, so the exposed acrosomal membrane domain is not simply the same membrane domain that joins the oolemma.", "s": "Langman, 12th ed., Ch. 3, fertilization; Moore, The Developing Human, fertilization; standard human sperm membrane biology."}, {"q": "The coat that surrounds the ovulated oocyte is removed before the first mitotic subdivision of the fertilised cell.", "a": false, "e": "The zona persists through cleavage and is lost around the end of the fourth day, before implantation. Compaction occurs while blastomeres remain enclosed by the zona.", "s": "Langman, 12th ed., Ch. 3, cleavage and blastocyst formation."}, {"q": "A follicle can alter the developmental competence of its enclosed oocyte through somatic-cell signalling without contributing chromosomes to the resulting conceptus.", "a": true, "e": "Granulosa and theca cells cooperate in follicular steroid production and communicate with the oocyte. Follicular development is a coordinated somatic–germ-cell process.", "s": "Langman, 12th ed., Ch. 3, ovarian cycle; Junqueira's Basic Histology, ovary."}, {"q": "The acquisition of epithelial polarity by outer blastomeres is merely a consequence of increasing cell number and is independent of blastomere position or cell–cell contact.", "a": false, "e": "Outer-cell polarity is not explained by cell number alone. Position, contact relationships and polarity-associated organisation contribute to the distinction between outer trophectodermal cells and inner embryoblast cells.", "s": "Langman, 12th ed., Ch. 3, cleavage and blastocyst formation; Moore, The Developing Human."}, {"q": "Formation of the blastocyst cavity requires the outer cell population to acquire properties that are not required of the inner cell population in the same way.", "a": true, "e": "The trophectoderm forms an epithelial outer layer with junctional complexes and transport functions that support blastocyst cavitation. This is an early example of tissue-level organisation.", "s": "Langman, 12th ed., Ch. 3, blastocyst formation; Alberts, Molecular Biology of the Cell."}, {"q": "A contact-dependent ligand–receptor interaction remains juxtacrine at the initiating interface even when receptor cleavage produces a transcriptional response in the receiving cell.", "a": true, "e": "Juxtacrine signalling depends on direct cell contact or non-diffusible, matrix-associated interactions. Freely diffusible ligands acting over a distance are characteristic of paracrine or endocrine signalling.", "s": "Langman, 12th ed., Ch. 1, cell signalling."}, {"q": "The parental pronuclear envelopes unite to form a persistent diploid interphase nucleus before the first cleavage spindle is assembled.", "a": false, "e": "In humans, pronuclei approach and their envelopes break down; parental chromosomes participate in the first mitotic division. The simplified notion of two pronuclear membranes fusing into one nucleus is inaccurate.", "s": "Moore, The Developing Human, fertilization; standard embryology."}, {"q": "The ovulatory LH surge completes the secondary oocyte's second meiotic division before follicular rupture, leaving sperm entry to initiate pronuclear formation only.", "a": false, "e": "The LH surge is associated with resumption and completion of meiosis I, followed by ovulation of a secondary oocyte arrested in metaphase II. Sperm entry triggers completion of meiosis II and extrusion of the second polar body.", "s": "Langman, 12th ed., Ch. 3, ovarian cycle; Moore, The Developing Human, reproductive cycles."}, {"q": "A spermatozoon may retain progressive motility and traverse the cumulus investment while lacking the membrane state required for a normal zona-triggered response.", "a": true, "e": "Passage through the cumulus/corona is not proof of fertilising competence. Capacitation is required for normal zona interaction and acrosome responsiveness.", "s": "Langman, 12th ed., Ch. 3, fertilization."}, {"q": "Successful implantation requires the maternal immune system to become globally inactive because the trophoblast carries paternally derived antigens.", "a": false, "e": "Implantation involves local immune modulation and specialised maternal–fetal tolerance, not global immunosuppression. The endometrium contains immune cells that contribute to normal implantation and placentation.", "s": "Moore, The Developing Human, implantation; standard reproductive immunology."}, {"q": "A fixed ligand concentration does not imply a fixed developmental output when receptor abundance, intracellular pathway state and transcriptional competence differ between responding cells.", "a": true, "e": "A signal does not dictate fate in isolation. Cellular competence, receptor availability, downstream pathways and cross-talk determine the response to a ligand.", "s": "Langman, 12th ed., Ch. 1, cell signalling and induction; Alberts, Molecular Biology of the Cell."}, {"q": "The ovulated human gamete has undergone reduction of chromosome number without completion of chromatid segregation, and its subsequent activation is coupled to a second polar-body event.", "a": true, "e": "The ovulated secondary oocyte is arrested in metaphase II. Sperm entry triggers completion of meiosis II, extrusion of the second polar body and formation of the female pronucleus.", "s": "Langman, 12th ed., Ch. 2, oogenesis; Ch. 3, fertilization."}, {"q": "A membrane-bound ligand can initiate receptor cleavage in an adjacent cell, converting a contact-dependent event into a change in nuclear gene regulation.", "a": true, "e": "Delta or related ligands on one cell bind Notch on an adjacent cell. Proteolytic cleavage releases the Notch intracellular domain, which participates in transcriptional regulation.", "s": "Langman, 12th ed., Ch. 1, juxtacrine signalling; standard developmental biology."}, {"q": "A conceptus derived from a single fertilised oocyte can contain cell populations with different karyotypes without requiring an aneuploid gamete at conception.", "a": true, "e": "Postzygotic mitotic nondisjunction or chromosome loss can produce distinct cell lines within one conceptus. This differs from meiotic aneuploidy present in the gamete.", "s": "Moore, The Developing Human, chromosomal abnormalities; standard medical genetics."}, {"q": "Successful traversal of the zona pellucida is a necessary upstream event in ordinary fertilisation, but it is not a sufficient criterion for the establishment of a biparental diploid genome.", "a": true, "e": "Zona penetration and sperm–oocyte membrane fusion precede pronuclear formation and apposition. The male and female pronuclei form after sperm entry; their genetic material subsequently participates in the first mitotic division.", "s": "Langman, 12th ed., Ch. 3, fertilization."}, {"q": "The chromosome behaviour characteristic of meiotic prophase is recapitulated during the rapid mitotic divisions that subdivide the zygotic cytoplasm.", "a": false, "e": "Mitotic cleavage separates replicated sister chromatids and does not normally involve homologous pairing and meiotic crossing-over. Recombination is a characteristic of meiosis I.", "s": "Langman, 12th ed., Ch. 2, meiosis; Ch. 3, cleavage."}, {"q": "The endocrine event responsible for follicular rupture also removes the extracellular coat that must later be absent for implantation to occur.", "a": false, "e": "The LH surge induces changes leading to follicular rupture and release of the cumulus–oocyte complex. The zona pellucida remains around the ovulated oocyte and is lost only after blastocyst hatching.", "s": "Langman, 12th ed., Ch. 3, ovarian cycle and fertilization."}, {"q": "Loss of a developmental ligand and loss of its cognate receptor must produce indistinguishable phenotypes wherever the pathway is expressed.", "a": false, "e": "Ligand and receptor mutations may overlap phenotypically but need not be identical. Receptor expression, alternative ligands, pathway cross-talk and tissue-specific timing modify the outcome.", "s": "Langman, 12th ed., Ch. 1, signal transduction and FGF signalling."}, {"q": "A conceptus may continue cleavage during tubal transit; consequently, altered tubal physiology can affect the embryo without being the primary cause of a chromosome-segregation error.", "a": true, "e": "Cleavage occurs during transit through the uterine tube. The conceptus reaches the uterine cavity as a morula/early blastocyst, depending on timing.", "s": "Langman, 12th ed., Ch. 3, cleavage and blastocyst formation."}, {"q": "The post-fertilisation block to additional sperm entry in humans is mediated by a newly synthesised chitinous envelope analogous to that of certain non-mammalian ova.", "a": false, "e": "The human block to polyspermy involves cortical granule-mediated modification of the zona pellucida; the classic rigid fertilisation envelope is characteristic of some other species, not a human chitinous coat.", "s": "Moore, The Developing Human, fertilization; standard comparative embryology."}, {"q": "A failure in the transition from zona-enclosed blastocyst to hatching blastocyst can occur downstream of successful fertilisation and repeated cleavage.", "a": true, "e": "Hatching is a post-fertilisation event that permits implantation. Its failure can occur despite successful gamete fusion and early cleavage.", "s": "Langman, 12th ed., Ch. 3, fertilization and blastocyst formation."}, {"q": "The blood–testis barrier and the zona pellucida are both selective interfaces; their selectivity is generated by structurally equivalent cellular architectures.", "a": false, "e": "The blood–testis barrier is formed by Sertoli-cell junctions and protects developing germ cells. The zona pellucida is an extracellular glycoprotein coat involved in sperm interaction, protection and prevention of premature adhesion.", "s": "Junqueira's Basic Histology, male reproductive system; Langman, 12th ed., Ch. 3."}, {"q": "The ovarian reserve at birth is progressively remodelled by follicular loss before the onset of reproductive cycling.", "a": true, "e": "Oogonia proliferate prenatally and enter meiosis to become primary oocytes. The ovarian reserve declines through atresia and ovulation; new oocyte production is not the normal postnatal pattern.", "s": "Langman, 12th ed., Ch. 2, oogenesis; Moore, The Developing Human."}, {"q": "The major paracrine signalling families used repeatedly in embryogenesis behave as independent modules whose outputs do not materially influence one another.", "a": false, "e": "These families are repeatedly used during development and show extensive pathway cross-talk. Their effects depend on ligand, receptor and tissue context.", "s": "Langman, 12th ed., Ch. 1, paracrine signalling factors."}, {"q": "The extracellular coat surrounding the oocyte is generated de novo by the trophoblast after fertilisation and persists until implantation.", "a": false, "e": "The zona pellucida is assembled during oocyte growth from zona proteins produced by the oocyte and surrounding follicular cells, and it remains around the conceptus during cleavage before hatching.", "s": "Langman, 12th ed., Ch. 3, fertilization and cleavage; Moore, The Developing Human, oocyte and preimplantation development."}, {"q": "The cellular investment surrounding the ovulated oocyte contains follicular somatic derivatives whose extracellular matrix affects the route taken by sperm before zona contact.", "a": true, "e": "The cumulus complex surrounds the ovulated oocyte and contains granulosa-derived cells embedded in an extracellular matrix. Sperm must traverse this cellular investment before reaching the zona pellucida.", "s": "Langman, 12th ed., Ch. 3, fertilization; Moore, The Developing Human."}, {"q": "The membrane state acquired during capacitation is permissive for acrosomal responsiveness, but the occurrence of acrosomal exocytosis cannot retrospectively establish that capacitation was physiologically normal.", "a": true, "e": "Capacitation precedes the acrosome reaction and enables sperm to respond appropriately to zona-associated signals. The acrosome reaction involves membrane fusion and release of acrosomal contents.", "s": "Langman, 12th ed., Ch. 3, fertilization."}, {"q": "The depth of trophoblastic penetration can be predicted from protease expression alone, without reference to adhesion systems or the maternal extracellular matrix.", "a": false, "e": "Invasion is controlled by reciprocal interactions among trophoblast, extracellular matrix and endometrial tissue. Proteases are important but not sufficient as a complete explanation.", "s": "Langman, 12th ed., Ch. 3, implantation; standard reproductive biology."}, {"q": "A morphogen gradient can specify distinct cell states only when its principal action is to increase the mitotic rate of the responding population.", "a": false, "e": "Morphogens provide positional information through concentration-dependent effects on cell fate and gene expression; they may also influence proliferation, but mitogenesis alone does not define a morphogen.", "s": "Gilbert & Barresi, Developmental Biology, morphogen gradients; Langman, 12th ed., Ch. 1."}, {"q": "A tissue exposed to an inductive cue may fail to change fate if its prior molecular state does not permit interpretation of that cue.", "a": true, "e": "Competence is the ability to respond to an inductive cue and depends on the responder's molecular state. Without competence, the same signal may have no effect or a different effect.", "s": "Langman, 12th ed., Ch. 1, induction and organ formation."}, {"q": "The existence of a ligand–receptor interaction does not establish induction unless the responding tissue possesses the competence to translate that interaction into a changed developmental programme.", "a": true, "e": "Both involve molecular recognition and signalling, but the molecular players and outcomes differ. Shared principles should not be mistaken for identical pathways.", "s": "Langman, 12th ed., Ch. 1, cell signalling; Ch. 3, fertilization; standard reproductive biology."}, {"q": "A normal sperm concentration is sufficient evidence that the chromatin, membrane remodelling and exocytotic competence of the ejaculated sperm population are intact.", "a": false, "e": "Sperm count alone does not establish normal morphology, motility, DNA integrity or functional competence. Fertilisation depends on several independent sperm attributes.", "s": "WHO laboratory manual for human semen, 6th ed.; Junqueira's Basic Histology."}, {"q": "The Sertoli-cell junctional complex prevents homologous recombination during spermatocyte meiosis by excluding recombination enzymes from the adluminal compartment.", "a": false, "e": "Crossing-over is a programmed meiotic event occurring within primary spermatocytes. The blood–testis barrier maintains the germ-cell microenvironment and immune protection; it does not prevent recombination.", "s": "Junqueira's Basic Histology, testis; Langman, 12th ed., Ch. 2, meiosis."}, {"q": "The germ-cell precursors that later colonise the gonadal ridges originate within the seminiferous epithelium and migrate outward before entering meiosis.", "a": false, "e": "Primordial germ cells are specified early, become identifiable near the yolk-sac wall close to the allantois, and migrate to the genital ridges. They do not originate in seminiferous cords or enter meiosis at that stage.", "s": "Langman, 12th ed., Ch. 2, primordial germ cells."}, {"q": "The basal–adluminal boundary in the seminiferous epithelium is a Sertoli-cell junctional boundary, not simply the basement membrane viewed at a different histological level.", "a": true, "e": "Sertoli-cell tight junctions divide the seminiferous epithelium into basal and adluminal compartments, regulating the microenvironment of developing germ cells and limiting immune exposure. It has no role in sperm transit after ejaculation.", "s": "Ross & Pawlina, Histology: A Text and Atlas, testis; Junqueira's Basic Histology, male reproductive system."}, {"q": "The conversion of spermatids into structurally specialised spermatozoa includes the reductional chromosome divisions that generate haploidy.", "a": false, "e": "Spermatogenesis is the overall process from spermatogonia through meiosis and spermiogenesis. Spermiogenesis specifically describes the transformation of haploid spermatids into spermatozoa.", "s": "Langman, 12th ed., Ch. 2, spermatogenesis; Junqueira's Basic Histology."}, {"q": "An obstruction beyond the usual site of fertilisation cannot compromise the movement of the early conceptus into the uterine cavity.", "a": false, "e": "The uterine tube is required for oocyte pickup, sperm transport, fertilisation and movement of the early embryo toward the uterus. Obstruction can prevent gamete encounter or impair embryo transport, depending on its location.", "s": "Langman, 12th ed., Ch. 3, fertilization and cleavage; Moore, The Developing Human."}, {"q": "Homologous recombination is principally completed after homologues have reached the metaphase plate of the second meiotic division.", "a": false, "e": "Crossing-over occurs during prophase I, especially pachytene, after homologous chromosomes pair. Metaphase II aligns individual chromosomes before sister-chromatid separation.", "s": "Langman, 12th ed., Ch. 2, meiosis; standard genetics."}, {"q": "The regulative capacity of early blastomeres ensures that removal of any one cell is fully compensated, regardless of the stage or lineage already acquired.", "a": false, "e": "Early embryos show considerable regulative capacity, but it is not unlimited. Outcome depends on timing, severity, lineage allocation and embryo quality; complete compensation is not guaranteed.", "s": "Moore, The Developing Human, preimplantation development; standard developmental biology."}, {"q": "The zona pellucida is transiently protective during tubal transit but becomes a physical impediment when the conceptus acquires implantation competence.", "a": true, "e": "The zona has stage-dependent functions: it protects the early conceptus and limits ectopic attachment during transit, then must be lost for implantation to occur.", "s": "Langman, 12th ed., Ch. 3, cleavage, blastocyst formation and implantation."}, {"q": "The inner cell mass and a totipotent cleavage-stage blastomere may share embryonic potential while differing in their capacity to independently generate the extraembryonic trophoblast lineage.", "a": true, "e": "Totipotent cells can contribute to the embryo and extraembryonic tissues; pluripotent inner-cell-mass cells form the embryo proper and some associated lineages but not a complete conceptus independently.", "s": "Alberts, Molecular Biology of the Cell, stem cells and early development; Moore, The Developing Human."}, {"q": "The directed migration of primordial germ cells and the invasive behaviour of trophoblast share a general reliance on tissue navigation, but they are not manifestations of one identical cellular programme.", "a": true, "e": "Both processes require directed movement through tissue environments and interactions with extracellular matrix and signalling cues. They are not mechanistically identical, but the comparison tests a shared developmental principle.", "s": "Langman, 12th ed., Ch. 2, primordial germ cells; Ch. 3, implantation; Moore, The Developing Human."}, {"q": "The common zygotic origin of embryoblast and trophoblast means that the two populations remain equivalent in developmental potency throughout blastocyst formation.", "a": false, "e": "Although both derive from the zygote, they become distinct lineages with different developmental potentials. Trophoblast contributes to placental tissues; embryoblast gives rise to the embryo proper.", "s": "Langman, 12th ed., Ch. 3, blastocyst formation; Moore, The Developing Human."}, {"q": "Oocyte activation can initiate events required for cleavage even when a later defect prevents normal segregation or specification of embryonic lineages.", "a": true, "e": "Oocyte activation and early cleavage can occur before some genetic defects become developmentally consequential. Initiation of development is not proof of long-term viability.", "s": "Moore, The Developing Human, fertilization and preimplantation development; standard developmental genetics."}, {"q": "The embryonic pole is defined by the position of the blastocyst cavity, while the embryoblast occupies the opposite pole.", "a": false, "e": "The embryonic pole is the side containing the embryoblast. The opposite side is the abembryonic pole; the blastocyst cavity does not define the embryonic pole.", "s": "Langman, 12th ed., Ch. 3, blastocyst formation and implantation."}, {"q": "A signal produced by trophoblastic tissue sustains ovarian steroid support during the interval in which the conceptus is not yet supported by a fully functional placenta.", "a": true, "e": "After implantation, trophoblastic hCG rescues the corpus luteum from regression. The corpus luteum continues progesterone production during early pregnancy until placental steroid production is sufficient.", "s": "Langman, 12th ed., Ch. 3, ovarian cycle; Moore, The Developing Human."}, {"q": "The endocrine rescue of the corpus luteum is an embryonic signal acting upon a maternal endocrine structure, rather than a direct consequence of implantation mechanically disrupting the endometrium.", "a": true, "e": "The early embryo may compensate for some cell losses, while severe insults may cause embryonic death. Timing, dose, mechanism and developmental potential matter; the all-or-none concept is a generalisation.", "s": "Moore, The Developing Human, principles of teratology; standard embryology."}, {"q": "The prolonged meiotic arrest of the primary oocyte creates a biological interval during which deterioration of chromosome-cohesion mechanisms may become consequential.", "a": true, "e": "Primary oocytes remain arrested for years or decades. Cohesin deterioration, spindle abnormalities and altered chromosome segregation are among mechanisms associated with increasing maternal-age-related aneuploidy.", "s": "Langman, 12th ed., Ch. 2, oogenesis; NCBI Bookshelf, reproductive ageing and oocyte aneuploidy."}, {"q": "Normal parental karyotypes and conventional semen parameters do not exclude a defect in the maternal cytoplasmic environment required for early cleavage.", "a": true, "e": "Oocyte cytoplasm supplies organelles, RNAs, proteins and factors needed for activation and early cleavage. Normal sperm parameters and parental chromosome counts do not exclude maternal cytoplasmic defects.", "s": "Moore, The Developing Human, oocyte maturation and preimplantation development; reproductive biology literature."}, {"q": "A diploid conceptus with two chromosome complements from one parent is developmentally equivalent to a biparental conceptus if the total chromosome number is normal.", "a": false, "e": "Diploidy describes chromosome number, not parental origin. Genomic imprinting causes some genes to be expressed according to whether they were inherited maternally or paternally.", "s": "Langman, 12th ed., Ch. 2, chromosome theory of inheritance; standard genetics."}, {"q": "A normal diploid count is insufficient to establish normal biparental development when parent-of-origin-dependent gene expression is part of the developmental requirement.", "a": true, "e": "Trophoblastic tissue can produce hCG at an ectopic implantation site. hCG positivity therefore establishes trophoblastic activity but does not by itself establish normal intrauterine location.", "s": "Moore, The Developing Human, implantation and ectopic pregnancy; standard obstetrics."}, {"q": "The polar body is a lineage intermediate that normally contributes a substantial fraction of the conceptus's extraembryonic tissues.", "a": false, "e": "Polar bodies are small products of meiotic divisions that receive chromosomes with minimal cytoplasm. They do not normally contribute to the embryo or extraembryonic membranes.", "s": "Langman, 12th ed., Ch. 2, oogenesis; standard embryology."}, {"q": "An error in homologous chromosome segregation during maternal meiosis can be carried into an embryo that nevertheless undergoes fertilisation and early cleavage.", "a": true, "e": "Failure of homologous chromosomes to segregate in meiosis I can generate aneuploid gametes. Fertilisation may still occur, and early development may proceed despite an abnormal karyotype.", "s": "Langman, 12th ed., Ch. 2, chromosome theory of inheritance; Moore, The Developing Human, chromosomal abnormalities."}, {"q": "A meiotic segregation error can be present in the zygote from its first cell cycle, whereas a postzygotic mitotic error can create a second lineage after an initially euploid fertilisation.", "a": true, "e": "The sperm first traverses the corona radiata, then penetrates the zona pellucida, and finally fuses with the oocyte plasma membrane. These are distinct barriers and events.", "s": "Langman, 12th ed., Ch. 3, fertilization."}, {"q": "Normal sperm motility cannot by itself establish normal transport of either gametes or the conceptus through the uterine tube.", "a": true, "e": "Tubal transport depends on coordinated ciliary beating, muscular contractions and luminal fluid. Sperm motility is only one component of the reproductive transport system.", "s": "Moore, The Developing Human, fertilization and early development; standard reproductive physiology."}, {"q": "The acrosomal cap is assembled during the differentiation of the spermatid and is not created by the capacitation-associated membrane changes.", "a": true, "e": "The acrosome develops from Golgi-derived vesicles during spermiogenesis and forms the enzyme-containing cap over the sperm nucleus. Capacitation later modifies sperm membrane function but does not construct the acrosome.", "s": "Langman, 12th ed., Ch. 2, morphological changes during gamete maturation; Junqueira's Basic Histology, spermiogenesis."}, {"q": "Primordial germ-cell migration and trophoblastic invasion both involve directed cellular movement through tissue environments, but a shared requirement for motility does not establish identity of their guidance pathways.", "a": true, "e": "Implantation involves adhesion, proteolysis, invasion and reciprocal signalling between trophoblast and endometrium. The analogy is conceptual; trophoblast invasion is not identical to every epithelial–mesenchymal induction process.", "s": "Langman, 12th ed., Ch. 1, induction and signalling; Ch. 3, implantation."}, {"q": "A conceptus with a normal chromosome complement may fail to implant because the maternal epithelial signalling state is not permissive at the relevant time.", "a": true, "e": "Implantation is a coordinated interaction between conceptus and maternal tissue. Maternal receptivity and local signalling are essential independently of embryonic chromosomal normality.", "s": "Langman, 12th ed., Ch. 3, uterus at implantation; Moore, The Developing Human."}, {"q": "The transcriptional quiescence and cytoplasmic reduction of the mature spermatozoon make its developmental contribution dependent on structures assembled before ejaculation.", "a": true, "e": "Spermatozoa are highly specialised and transcriptionally quiescent. Their functional competence depends heavily on proteins and structures assembled during spermatogenesis and spermiogenesis.", "s": "Junqueira's Basic Histology, male reproductive system; WHO laboratory manual for human semen."}, {"q": "Every chromosome abnormality that causes later embryonic lethality prevents the conceptus from reaching the blastocyst stage.", "a": false, "e": "Some aneuploid conceptuses can undergo cleavage, form blastocysts and implant before developmental failure becomes apparent. Early development does not eliminate every chromosomal abnormality immediately.", "s": "Langman, 12th ed., Ch. 2, chromosome theory of inheritance; Moore, The Developing Human."}, {"q": "Failure of the oocyte's post-fusion cortical response may leave the extracellular coat functionally permissive to additional sperm entry.", "a": true, "e": "Cortical granule contents modify the zona pellucida and contribute to the block to polyspermy. Failure of this response can permit abnormal entry of additional sperm.", "s": "Langman, 12th ed., Ch. 3, fertilization; Moore, The Developing Human."}, {"q": "Premature acquisition of the capacitated membrane state within the male reproductive tract would preserve the normal duration and location of sperm fertilising competence.", "a": false, "e": "Capacitation is a complex functional maturation in the female tract involving membrane changes and removal of surface components, enabling zona interaction and the acrosome reaction. It is not simply increased motility.", "s": "Langman, 12th ed., Ch. 3, fertilization; WHO laboratory manual for human semen, sperm function."}, {"q": "Early cleavage cycles subdivide the zygote through mitoses while largely omitting the growth intervals characteristic of ordinary somatic cell cycles.", "a": true, "e": "Early cleavage cycles are rapid and abbreviated, with little or no gap-phase growth. The zygote's cytoplasm is subdivided into blastomeres rather than expanded.", "s": "Moore, The Developing Human, preimplantation development; standard cell biology."}, {"q": "Early human cleavage can proceed while the embryo remains substantially dependent on maternal products, such that the onset of embryonic transcription is not a prerequisite for the first mitotic division.", "a": true, "e": "Early cleavage relies substantially on maternal RNA and proteins stored in the oocyte. Embryonic genome activation occurs progressively; its timing varies by species and in humans becomes prominent around the 4- to 8-cell stages.", "s": "Moore, The Developing Human, preimplantation development; Alberts, Molecular Biology of the Cell, early embryogenesis."}, {"q": "A defect in protamine-mediated chromatin condensation can impair paternal genome function without changing the numerical chromosome contribution of the sperm.", "a": true, "e": "Protamination condenses the sperm genome and supports chromatin stability. A packaging defect can impair sperm function or increase DNA damage while chromosome count may remain numerically normal.", "s": "Langman, 12th ed., Ch. 2, morphological changes during gamete maturation; WHO semen manual; standard reproductive biology."}, {"q": "The calcium signal initiating oocyte activation is downstream of sperm entry; gap-junctional communication between blastomeres is not the upstream trigger for that signal.", "a": true, "e": "Fertilisation-associated oocyte activation depends principally on sperm-delivered PLCζ and calcium oscillations, not on gap-junctional signalling between blastomeres. Gap junctions become important in communication within the compacting morula.", "s": "Langman, 12th ed., Ch. 3, fertilization and cleavage; Moore, The Developing Human, early development."}, {"q": "A sperm-derived activating factor can initiate repetitive calcium signalling in the oocyte, linking gamete fusion to cortical granule release and meiotic resumption.", "a": true, "e": "Sperm-derived PLCζ is a major candidate factor that generates IP3-mediated calcium oscillations after gamete fusion. Calcium signalling contributes to oocyte activation, cortical granule release and completion of meiosis II.", "s": "Moore, The Developing Human, fertilization; review literature on PLCζ-mediated oocyte activation."}, {"q": "The sperm-induced calcium signal coordinates events in the oocyte that are separable in location and function from the membrane remodelling that enabled the sperm to reach the oolemma.", "a": true, "e": "Blastocyst formation depends on epithelial transport, tight junctions and osmotic movement of fluid into the developing cavity. Disrupting ion transport can impair cavitation.", "s": "Moore, The Developing Human, preimplantation development; standard cell physiology."}, {"q": "Capacitation and acrosomal exocytosis are distinct events, but the physiological order in which they occur is not interchangeable.", "a": true, "e": "Capacitation conditions sperm for fertilisation; the acrosome reaction is a subsequent exocytotic event facilitating zona penetration. They are sequential but not synonymous.", "s": "Langman, 12th ed., Ch. 3, fertilization."}, {"q": "The transition from morula to blastocyst is adequately described as another cleavage division, since it adds cells without establishing a new epithelial or fluid compartment.", "a": false, "e": "Blastocyst formation involves cavitation, epithelial organisation of trophectoderm, fluid transport and segregation of inner and outer cell populations. It is not merely another cleavage stage.", "s": "Langman, 12th ed., Ch. 3, blastocyst formation."}, {"q": "The blastocoel and the amniotic cavity are distinct developmental compartments, arising at different stages and from different cellular contexts.", "a": true, "e": "The blastocyst cavity develops as fluid enters and accumulates within the conceptus, separating the embryoblast from the trophoblast. The amniotic cavity forms later during the second week from epiblast-associated cells.", "s": "Langman, 12th ed., Ch. 3, blastocyst formation; Ch. 4, second week."}, {"q": "Intercellular bridges among clonally related spermatogenic cells can permit sharing of gene products across haploid cells that do not carry identical sex chromosomes.", "a": true, "e": "Cytoplasmic bridges maintain cytoplasmic continuity among clonally related germ cells, allowing sharing of RNAs and proteins and partial synchronisation of development. This is one reason haploid spermatids do not function as wholly isolated genetic units.", "s": "Langman, 12th ed., Ch. 2, spermatogenesis; Alberts, Molecular Biology of the Cell, cell junctions and germ-cell development."}, {"q": "Haploid spermatids need not express an entirely autonomous proteome, because clonal cytoplasmic continuity may persist after meiotic segregation has produced genetically non-identical cells.", "a": true, "e": "Blastocyst cavitation occurs during the first week. Gastrulation occurs in the third week and establishes the trilaminar germ disc; the blastocoel is not a germ-layer boundary.", "s": "Langman, 12th ed., Ch. 3, blastocyst formation; Ch. 5, gastrulation."}, {"q": "The increase in blastomere number during early cleavage is not accompanied by a proportionate increase in the overall dimensions of the conceptus.", "a": true, "e": "Cleavage increases cell number while individual blastomeres become smaller. The zona pellucida constrains expansion during the early divisions, so the embryo's overall size remains relatively constant.", "s": "Langman, 12th ed., Ch. 3, cleavage."}, {"q": "A blastocyst may complete cleavage and enter the uterine cavity yet remain unable to establish normal attachment if it does not shed its surrounding coat.", "a": true, "e": "Hatching removes the zona pellucida and is a prerequisite for direct trophoblast interaction with the endometrial surface. A retained zona can therefore interfere with implantation despite earlier cleavage.", "s": "Langman, 12th ed., Ch. 3, blastocyst formation and implantation; Moore, The Developing Human, implantation."}, {"q": "The ovulated secondary oocyte is haploid in chromosome number, but its chromosomes remain duplicated until completion of the second meiotic division.", "a": true, "e": "The secondary oocyte is haploid in chromosome number but each chromosome still consists of two sister chromatids because meiosis II has not yet been completed. It is arrested in metaphase II until fertilisation.", "s": "Langman, 12th ed., Ch. 2, oogenesis; Ch. 3, fertilization."}, {"q": "A defect in adhesion-receptor function at the maternal–embryonic interface may uncouple normal blastocyst development from successful implantation.", "a": true, "e": "Adhesion molecules, including integrins and selectins, participate in blastocyst–endometrial interactions. A normal embryo can fail to implant if the adhesion interface is defective.", "s": "Langman, 12th ed., Ch. 3, uterus at time of implantation; Moore, The Developing Human."}, {"q": "Maternal cytoplasmic determinants influence early lineage allocation, but their presence does not mean that embryoblast and trophoblast identities are irreversibly fixed before fertilisation.", "a": true, "e": "Maternal factors contribute to early development, but lineage segregation emerges during cleavage and blastocyst formation. Compaction, cell position, polarity and differential gene expression participate in separating inner cell mass and trophectoderm fates.", "s": "Langman, 12th ed., Ch. 3, cleavage and blastocyst formation; Moore, The Developing Human, preimplantation development."}, {"q": "Disruption of the Sertoli-cell barrier may expose developing germ-cell antigens that are ordinarily sequestered from much of the systemic immune environment.", "a": true, "e": "Developing germ cells express antigens that may be recognised as foreign after immune tolerance is established. Sertoli-cell junctions help maintain immune privilege; disruption can compromise this protection.", "s": "Junqueira's Basic Histology, male reproductive system; Ross & Pawlina, testis."}, {"q": "The immunological significance of the Sertoli-cell junctional barrier becomes especially relevant after germ cells begin expressing antigens not encountered during the establishment of systemic immune tolerance.", "a": true, "e": "Primordial germ cells contribute to both sexes, while Sertoli cells and the blood–testis barrier are components of the male gonadal microenvironment. The defects act at different developmental and tissue levels.", "s": "Langman, 12th ed., Ch. 2, primordial germ cells; Junqueira's Basic Histology, testis."}, {"q": "Implantation at the abembryonic pole necessarily prevents the embryoblast from forming a normal embryonic disc.", "a": false, "e": "Implantation normally begins at the embryonic pole, but atypical orientation does not automatically establish that embryonic-disc development is impossible. The statement overstates a positional association as an absolute developmental rule.", "s": "Langman, 12th ed., Ch. 3, blastocyst formation and implantation; Moore, The Developing Human."}, {"q": "Overlapping ligands and pathway cross-talk can buffer some developmental signalling defects, but redundancy does not guarantee phenotypic rescue.", "a": true, "e": "Developmental pathways contain overlapping ligands and interconnected downstream components. Compensation depends on expression, receptor specificity, timing and tissue context.", "s": "Langman, 12th ed., Ch. 1, cell signalling and paracrine factors."}, {"q": "A polyspermic zygote is compatible with normal development whenever the total number of chromosomes contributed by all sperm restores a diploid count.", "a": false, "e": "Polyspermy produces an abnormal chromosome complement, often including triploidy or multiploidy, and disrupts normal spindle organisation and cleavage. Diploidy must be restored in the correct biparental manner.", "s": "Langman, 12th ed., Ch. 3, fertilization; Moore, The Developing Human."}, {"q": "Restoration of the diploid chromosome count by entry of more than one sperm cannot be equated with restoration of the normal biparental genome.", "a": true, "e": "Progesterone prepares and maintains the endometrium for implantation, including secretory changes and stromal responses. Trophoblastic invasiveness cannot substitute for uterine receptivity.", "s": "Langman, 12th ed., Ch. 3, ovarian cycle and uterus at implantation; standard reproductive physiology."}, {"q": "Maternal-effect gene dysfunction may become evident after fertilisation even when the paternal genome and gross gamete morphology appear unremarkable.", "a": true, "e": "Maternal transcripts and proteins deposited during oogenesis regulate early embryonic events before full embryonic genome activation. Defects can therefore manifest after fertilisation despite apparently normal gametes.", "s": "Moore, The Developing Human, preimplantation development; NCBI review literature on maternal-effect genes."}, {"q": "A Y-bearing sperm establishes chromosomal sex, but this chromosomal constitution alone is sufficient to ensure testicular differentiation independently of downstream gene function.", "a": false, "e": "The Y chromosome commonly carries SRY, which initiates the testis-determining pathway. A defective or absent SRY pathway can disrupt testicular differentiation despite a 46,XY karyotype.", "s": "Langman, 12th ed., Ch. 2, chromosome theory of inheritance; Moore, The Developing Human, sex determination."}, {"q": "Chromosomal sex and gonadal differentiation are related developmental levels, but the presence of a Y chromosome does not make downstream testis-determining gene activity dispensable.", "a": true, "e": "Compaction involves increased cell adhesion, polarisation and tight cell contacts, helping distinguish inner and outer cell populations. It is not primarily apoptotic cell elimination.", "s": "Langman, 12th ed., Ch. 3, cleavage; Moore, The Developing Human."}, {"q": "Reduction of chromosome number is completed during the first meiotic division of spermatogenesis, although sister-chromatid separation is deferred until the subsequent division.", "a": true, "e": "Meiosis I is the reductional division: homologous chromosomes separate, producing haploid secondary spermatocytes whose chromosomes still have two chromatids. Meiosis II separates sister chromatids.", "s": "Langman, 12th ed., Ch. 2, spermatogenesis; standard cell biology."}];let order=[],answers={},score=0;const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function render(){order=shuffle([...BANK.keys()]);answers={};score=0;$('score').textContent='0';$('answered').textContent='0';$('result').style.display='none';const root=$('questions');root.innerHTML='';
order.forEach((bankIndex,index)=>{const item=BANK[bankIndex],card=document.createElement('article');card.className='question';const head=document.createElement('div');head.className='qhead';const num=document.createElement('div');num.className='num';num.textContent=index+1;const q=document.createElement('div');q.className='qtext';q.textContent=item.q;head.append(num,q);card.append(head);
const choices=document.createElement('div');choices.className='choices';['TRUE','FALSE'].forEach(value=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=value;b.addEventListener('click',()=>answer(bankIndex,value==='TRUE',choices,feedback));choices.append(b);});
const feedback=document.createElement('div');feedback.className='feedback';card.append(choices,feedback);root.append(card);});}
function answer(i,value,choices,feedback){if(Object.prototype.hasOwnProperty.call(answers,i))return;answers[i]=value;const item=BANK[i],correct=value===item.a;score+=correct?1:-1;
[...choices.children].forEach(b=>{b.disabled=true;if((b.textContent==='TRUE')===value)b.classList.add('selected',value?'true':'false');});
feedback.className='feedback show '+(correct?'correct':'incorrect');const verdict=document.createElement('strong');verdict.textContent=correct?'Correct · +1':'Incorrect · −1';const explanation=document.createElement('span');explanation.textContent=item.e;const source=document.createElement('span');source.className='source';source.textContent='Reference: '+item.s;feedback.append(verdict,explanation,source);
$('score').textContent=score;$('answered').textContent=Object.keys(answers).length;if(Object.keys(answers).length===BANK.length){$('finalScore').textContent=(score>0?'+':'')+score;$('summary').textContent='100 questions answered. Correct answers earn +1; incorrect answers earn −1; unanswered questions earn 0.';$('result').style.display='block';}}
$('retake').addEventListener('click',render);$('again').addEventListener('click',()=>{render();window.scrollTo({top:0,behavior:'smooth'});});render();
</script></body></html>
