<!-- CLINICAL CASE 2 — SURGICAL HUMERAL FRACTURE -->
<!-- =============================== -->

<div class="case-card">

    <h2>Clinical Case 2 — 🦴 Surgical Humeral Fracture</h2>

    <a href="Clinical_Surgical_Humeral_Fracture.html"
       style="
       display:inline-block;
       padding:12px 18px;
       background:#20d9e8;
       color:white;
       text-decoration:none;
       border-radius:8px;
       font-weight:bold;
       margin-top:8px;
       ">
        🦴 Surgical Humeral Fracture
    </a>

</div>

<script>
(async function () {
  const container = document.body;
  const repoAPI =
    "https://api.github.com/repos/imoyo3250-netizen/medprep/git/trees/main?recursive=1";

  function normalise(path) {
    return path.replace(/^\.\/+/, "")
      .split(/[?#]/)[0]
      .toLowerCase();
  }

  const existing = new Set(
    [...document.querySelectorAll(".case-card a[href]")]
      .map(a => normalise(a.getAttribute("href")))
  );

  try {
    const response = await fetch(repoAPI, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("GitHub file listing could not be loaded");
    }

    const data = await response.json();

    if (data.truncated) {
      throw new Error("GitHub file listing was truncated");
    }

    data.tree
      .filter(item =>
        item.type === "blob" &&
        item.path.toLowerCase().startsWith("clinical_") &&
        item.path.toLowerCase().endsWith(".html") &&
        !item.path.includes("/")
      )
      .sort((a, b) => a.path.localeCompare(b.path))
      .forEach(item => {
        const file = item.path;

        if (
          normalise(file) === "clinical_correlations.html" ||
          existing.has(normalise(file))
        ) return;

        const title = file
          .replace(/\.html$/i, "")
          .replace(/^Clinical_/, "")
          .replace(/[_-]+/g, " ")
          .replace(/\b\w/g, c => c.toUpperCase());

        const card = document.createElement("div");
        card.className = "case-card";

        const heading = document.createElement("h2");
        heading.textContent = "Clinical Case — " + title;

        const link = document.createElement("a");
        link.href = file;
        link.textContent = "Open " + title;

        Object.assign(link.style, {
          display: "inline-block",
          padding: "12px 18px",
          background: "#20d9e8",
          color: "white",
          textDecoration: "none",
          borderRadius: "8px",
          fontWeight: "bold",
          marginTop: "8px"
        });

        card.append(heading, link);
        container.appendChild(card);
        existing.add(normalise(file));
      });

  } catch (error) {
    console.error("Clinical detection error:", error);
  }
})();
</script>
