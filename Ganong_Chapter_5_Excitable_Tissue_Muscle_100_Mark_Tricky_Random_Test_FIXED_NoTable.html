function shuffle(arr){
  arr=[...arr];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function shuffleBalanced(groups){
  const out=[];
  let lastAnswerByPos=[null,null,null,null,null];

  groups.forEach(q=>{
    const statements=q[1].map(s=>[...s]);
    let best=null,bestPenalty=Infinity;

    for(let attempt=0;attempt<100;attempt++){
      const candidate=shuffle(statements.map(s=>[...s]));
      let penalty=0;

      candidate.forEach((s,i)=>{
        if(lastAnswerByPos[i]!==null && lastAnswerByPos[i]===s[1]) penalty+=6;
      });

      for(let i=1;i<candidate.length;i++){
        if(candidate[i][1]===candidate[i-1][1]) penalty+=1;
      }

      if(penalty<bestPenalty){bestPenalty=penalty;best=candidate;}
      if(penalty===0)break;
    }

    best.forEach((s,i)=>lastAnswerByPos[i]=s[1]);
    out.push([q[0],best]);
  });
  return out;
}
