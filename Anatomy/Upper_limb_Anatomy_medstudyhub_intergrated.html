main{max-width:980px;margin:20px auto;padding:0 14px 42px}.toolbar{position:sticky;top:0;z-index:5;background:rgba(243,245,248,.96);backdrop-filter:blur(8px);padding:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

<script>
const BANK = [{"q": "Deep arteries of the forearm are accompanied by venae comitantes, whereas superficial venous return follows a separate subcutaneous network with communications.", "a": true, "e": "Deep and superficial venous systems are anatomically distinct but communicate.", "s": "Snell 9e, Ch. 9, vessels of upper limb."}, {"q": "A suprascapular nerve lesion proximal to the suprascapular notch may affect both supraspinatus and infraspinatus, whereas a lesion near the spinoglenoid notch may preferentially affect infraspinatus.", "a": true, "e": "Supraspinatus branch arises before the nerve reaches the spinoglenoid notch.", "s": "Snell 9e, Ch. 9, scapular region."}, {"q": "Dorsal scapular nerve supplies serratus anterior, so its injury produces the same medial scapular winging as long thoracic nerve injury.", "a": false, "e": "Dorsal scapular supplies rhomboids; long thoracic supplies serratus anterior.", "s": "Snell 9e, Ch. 9, scapular region."}, {"q": "The proximal radioulnar joint is entirely separate from the elbow capsule in all individuals, and elbow flexion therefore has no anatomical relation to forearm rotation.", "a": false, "e": "The proximal radioulnar joint is part of the elbow complex and shares its capsule; forearm rotation is anatomically linked to elbow region.", "s": "Snell 9e, Ch. 9, elbow joint."}, {"q": "Pronation and supination occur entirely at the wrist, because the proximal radioulnar articulation is not part of the elbow complex.", "a": false, "e": "Rotation occurs at proximal and distal radioulnar joints; proximal radioulnar joint is part of the elbow complex.", "s": "Snell 9e, Ch. 9, elbow and radioulnar joints."}, {"q": "Intermuscular septa are fibrous extensions of deep fascia attaching to bone; they help define compartments and may also provide surfaces for muscle attachment.", "a": true, "e": "They are not loose areolar tissue; they form strong partitions.", "s": "Snell 9e, Basic Anatomy p. 7; Ch. 9, fascia and compartments."}, {"q": "The axillary nerve and posterior circumflex humeral vessels pass through a space whose lateral boundary is the surgical neck, explaining their vulnerability in injuries near that region.", "a": true, "e": "These structures traverse the quadrangular space, bounded laterally by the surgical neck.", "s": "Snell 9e, Ch. 9, scapular region, p. 360."}, {"q": "The radial collateral ligament is the structure that encircles the radial head, while the annular ligament attaches to the lateral epicondyle and prevents varus displacement.", "a": false, "e": "Annular ligament encircles radial head; radial collateral ligament arises from lateral epicondyle and blends with annular ligament.", "s": "Snell 9e, Ch. 9, elbow joint."}, {"q": "Isolated deltoid paralysis localises to suprascapular nerve because deltoid and supraspinatus share a terminal nerve despite different spinal root contributions.", "a": false, "e": "Deltoid is axillary; supraspinatus is suprascapular nerve.", "s": "Snell 9e, Ch. 9, scapular region."}, {"q": "The cephalic vein normally pierces deep fascia in the mid-arm to join brachial veins, while basilic vein remains superficial until it pierces clavipectoral fascia.", "a": false, "e": "Basilic pierces deep fascia in arm and joins brachial veins; cephalic pierces clavipectoral fascia near deltopectoral groove.", "s": "Snell 9e, Ch. 9, superficial veins."}, {"q": "The dominant contributions of the radial and ulnar arteries to the deep and superficial palmar arches are typical patterns rather than invariant rules.", "a": true, "e": "The usual pattern is radial-dominant deep arch and ulnar-dominant superficial arch, with variations.", "s": "Snell 9e, Ch. 9, palmar arches."}, {"q": "The interosseous membrane contributes to structural partitioning and force transfer between radius and ulna, so its injury can affect more than local muscle attachment.", "a": true, "e": "It binds the bones, provides attachment and transmits loads.", "s": "Snell 9e, Ch. 9, radius and ulna."}, {"q": "Extensor pollicis longus forms the medial boundary of the anatomical snuffbox and changes direction around the dorsal radial tubercle before reaching the thumb.", "a": true, "e": "EPL forms medial boundary and turns around Lister's tubercle.", "s": "Snell 9e, Ch. 9, wrist and hand."}, {"q": "The long head of triceps contributes to the boundaries of posterior axillary spaces, while its origin from the infraglenoid tubercle also makes it the only triceps head to cross the shoulder.", "a": true, "e": "The long head lies between teres minor and teres major and crosses the shoulder joint.", "s": "Snell 9e, Ch. 9, scapular region and posterior arm."}, {"q": "The posterior compartment of the arm contains the radial nerve and profunda brachii, but the radial nerve supplies neither triceps nor anconeus because both are supplied by axillary nerve.", "a": false, "e": "Radial nerve supplies triceps and anconeus.", "s": "Snell 9e, Ch. 9, posterior arm."}, {"q": "Rhomboids are supplied by long thoracic nerve and stabilise the scapula by protraction, so their paralysis duplicates serratus anterior palsy.", "a": false, "e": "Rhomboids are dorsal scapular supplied and retract/downwardly rotate scapula; serratus anterior is long thoracic supplied.", "s": "Snell 9e, Ch. 9, scapular region."}, {"q": "The median nerve supplies the lateral two lumbricals and the ulnar nerve the medial two, so a median lesion may alter intrinsic extensor balance in digits even when interossei remain functional.", "a": true, "e": "Lumbricals are split between median and ulnar nerves; interossei are ulnar supplied.", "s": "Snell 9e, Ch. 9, intrinsic hand muscles."}, {"q": "The superficial palmar arch is usually radial-dominant and the deep arch ulnar-dominant, with little clinically relevant variation.", "a": false, "e": "The usual pattern is ulnar-dominant superficial arch and radial-dominant deep arch; variations are common.", "s": "Snell 9e, Ch. 9, palmar arches, pp. 402–403."}, {"q": "The sternoclavicular joint is the only direct bony articulation between upper limb and axial skeleton; scapulothoracic motion is functional rather than a true synovial articulation.", "a": true, "e": "The SC joint connects limb to axial skeleton; scapulothoracic interface is not a synovial joint.", "s": "Snell 9e, Ch. 9, pectoral girdle."}, {"q": "Deltoid inserts on radial tuberosity, while biceps inserts on deltoid tuberosity, so both insertions lie on the lateral humerus.", "a": false, "e": "Deltoid inserts on deltoid tuberosity; biceps on radial tuberosity.", "s": "Snell 9e, Ch. 9, arm muscles."}, {"q": "A wrist-level median lesion can impair opposition while sparing pronation because the thenar motor branch and pronator branches arise at different levels.", "a": true, "e": "Thenar muscles receive the recurrent branch; pronator branches arise in the forearm.", "s": "Snell 9e, Ch. 9, median nerve."}, {"q": "The deep palmar arch is predominantly ulnar and lies superficial to the long flexor tendons, while the superficial arch is predominantly radial and deep to metacarpal bases.", "a": false, "e": "The usual arrangement is reversed: superficial ulnar-dominant; deep radial-dominant.", "s": "Snell 9e, Ch. 9, palmar arches, pp. 402–403."}, {"q": "After acromioclavicular ligament disruption, the apparent elevation of the clavicle may partly reflect downward displacement of the scapula and attached limb.", "a": true, "e": "The clavicle may appear elevated relative to the dropped shoulder girdle.", "s": "Snell 9e, Ch. 9, acromioclavicular joint."}, {"q": "The brachial artery lies lateral to the median nerve in the distal arm, and the median nerve remains lateral to the artery in the cubital fossa.", "a": false, "e": "The median nerve crosses from lateral to medial and is medial to brachial artery distally; in cubital fossa TAN order is tendon, artery, nerve.", "s": "Snell 9e, Ch. 9, brachial artery and cubital fossa."}, {"q": "The pisiform directly articulates with the distal radius as part of the radiocarpal joint because it belongs to the proximal carpal row.", "a": false, "e": "The radiocarpal articulation involves scaphoid, lunate and triquetrum; pisiform is excluded.", "s": "Snell 9e, Ch. 9, wrist joint."}, {"q": "The extensor retinaculum is a palmar thickening that prevents flexor tendon bowstringing during finger flexion.", "a": false, "e": "The extensor retinaculum is dorsal and retains extensor tendons; the flexor retinaculum is palmar.", "s": "Snell 9e, Ch. 9, wrist."}, {"q": "A fracture of the scaphoid may be clinically important even when initial radiographs are unrevealing, because the proximal pole has a vulnerable retrograde blood supply.", "a": true, "e": "Scaphoid fractures can be occult early; proximal pole avascular necrosis risk follows blood supply pattern.", "s": "Snell 9e, Ch. 9, wrist and carpal bones."}, {"q": "The carrying angle reflects the geometry of distal humerus and proximal ulna, and should not be treated as a direct measure of collateral ligament tension alone.", "a": true, "e": "The angle is primarily an alignment feature of the elbow complex.", "s": "Snell 9e, Ch. 9, elbow joint."}, {"q": "A lesion of the posterior interosseous nerve must cause numbness over the dorsolateral hand because it is the terminal continuation of the superficial radial branch.", "a": false, "e": "PIN is the continuation of the deep radial branch and is motor; superficial radial branch supplies dorsolateral sensation.", "s": "Snell 9e, Ch. 9, radial nerve."}, {"q": "Brachialis is supplied exclusively by musculocutaneous nerve in every individual, while biceps receives a small radial contribution near its distal tendon.", "a": false, "e": "Brachialis is mainly musculocutaneous with a possible radial contribution to lateral part; biceps is musculocutaneous.", "s": "Snell 9e, Ch. 9, anterior arm."}, {"q": "The profunda brachii artery accompanies the ulnar nerve through the medial intermuscular septum and passes behind the medial epicondyle.", "a": false, "e": "Profunda brachii accompanies radial nerve in the radial groove; ulnar nerve passes behind medial epicondyle.", "s": "Snell 9e, Ch. 9, arm vessels and nerves."}, {"q": "The axillary artery is divided into three parts by the pectoralis minor, whereas the cords are named by their relationship to the second part of that artery.", "a": true, "e": "The muscle defines arterial parts; the second part provides the reference for naming the cords.", "s": "Snell 9e, Ch. 9, axilla, pp. 350–353."}, {"q": "The brachial plexus and axillary artery are enclosed by an axillary sheath, but the cords are named from the artery's second part rather than the first or third.", "a": true, "e": "The cords are lateral, medial and posterior relative to the second part.", "s": "Snell 9e, Ch. 9, axilla."}, {"q": "The lateral cutaneous nerve of forearm is the terminal continuation of musculocutaneous nerve, so lateral forearm sensory loss may localise a lesion proximal to its cutaneous continuation.", "a": true, "e": "The musculocutaneous nerve becomes the lateral cutaneous nerve of forearm.", "s": "Snell 9e, Ch. 9, musculocutaneous nerve."}, {"q": "A proximal brachial plexus lesion can produce deficits in more than one peripheral nerve territory, so naming the weakest terminal nerve does not necessarily identify the anatomical level of injury.", "a": true, "e": "Root/trunk/cord lesions affect fibres destined for several terminal nerves; distribution must be traced proximally.", "s": "Snell 9e, Ch. 9, brachial plexus."}, {"q": "A lesion of the deep radial branch at supinator may abolish biceps-mediated supination because biceps is supplied by the radial nerve distal to the elbow.", "a": false, "e": "Biceps is musculocutaneous-innervated; deep radial lesions affect posterior forearm extensors and supinator.", "s": "Snell 9e, Ch. 9, radial nerve."}, {"q": "Axillary lymphadenopathy cannot automatically be attributed to upper-limb pathology because axillary nodes also receive lymph from breast and thoracic wall territories.", "a": true, "e": "Axillary nodes drain multiple regions, including breast, thoracic wall and upper limb.", "s": "Snell 9e, Ch. 9, axillary lymph nodes."}, {"q": "The thenar eminence is formed principally by adductor pollicis, supplied by median nerve, and opposition is its primary action.", "a": false, "e": "Thenar eminence includes APB, FPB and opponens pollicis; adductor pollicis is deeper and ulnar supplied.", "s": "Snell 9e, Ch. 9, intrinsic hand muscles."}, {"q": "The superficial and deep palmar arches communicate, but the presence of an anastomosis does not guarantee adequate perfusion if a wound interrupts both the arch and its communicating branches.", "a": true, "e": "Collateral circulation depends on actual vascular continuity.", "s": "Snell 9e, Ch. 9, arteries of hand."}, {"q": "The medial pectoral nerve supplies only pectoralis major, while the lateral pectoral nerve supplies only pectoralis minor, despite their names.", "a": false, "e": "Both can contribute to pectoral muscles; medial pectoral commonly supplies minor and major, lateral mainly major.", "s": "Snell 9e, Ch. 9, pectoral region."}, {"q": "The quadrangular space transmits the radial nerve and profunda brachii artery, while the triangular interval transmits the axillary nerve and posterior circumflex humeral vessels.", "a": false, "e": "The contents are reversed: quadrangular space carries axillary nerve/posterior circumflex humeral vessels; triangular interval carries radial nerve/profunda brachii.", "s": "Snell 9e, Ch. 9, scapular region."}, {"q": "Shoulder stability depends on the labrum, capsule, ligaments and dynamic muscular control because the glenoid's bony congruity is limited relative to the range of motion.", "a": true, "e": "The shallow glenoid permits mobility; labrum and soft tissues improve stability.", "s": "Snell 9e, Ch. 9, shoulder joint."}, {"q": "The musculocutaneous nerve is a terminal branch of the posterior cord, although its fibres are mainly derived from C5–C7.", "a": false, "e": "It is a terminal branch of the lateral cord.", "s": "Snell 9e, Ch. 9, brachial plexus."}, {"q": "The superficial palmar arch gives rise to common palmar digital arteries that divide into proper digital branches, whereas the deep arch contributes mainly to metacarpal branches.", "a": true, "e": "The two arches supply different distal branches and regions.", "s": "Snell 9e, Ch. 9, arteries of hand."}, {"q": "The interosseous membrane is merely a passive partition and has no role in transmitting forces between radius and ulna.", "a": false, "e": "It binds the bones, provides attachment and transmits forces from radius toward ulna.", "s": "Snell 9e, Ch. 9, radius and ulna."}, {"q": "A lesion proximal to the upper trunk can impair muscles supplied by terminal nerves arising from different cords, even though the cords themselves remain anatomically continuous.", "a": true, "e": "The upper trunk contributes fibres that are redistributed through divisions and cords into several terminal nerves. A proximal lesion therefore produces a multi-nerve pattern.", "s": "Snell 9e, Ch. 9, brachial plexus, pp. 352–356."}, {"q": "The posterior forearm compartment is not functionally homogeneous: superficial extensors and deep extensors receive branches at different levels of the radial nerve pathway.", "a": true, "e": "The deep branch passes through supinator and continues as posterior interosseous nerve; branch levels matter for lesion localisation.", "s": "Snell 9e, Ch. 9, posterior forearm."}, {"q": "The first carpometacarpal joint is a plane synovial joint whose limited gliding is sufficient to produce opposition without rotation.", "a": false, "e": "It is a saddle synovial joint; opposition includes rotation.", "s": "Snell 9e, Ch. 9, joints of hand."}, {"q": "The middle finger defines the hand's axis for abduction and adduction, so these terms are referenced to the hand rather than the body's midsagittal plane.", "a": true, "e": "DAB/PAD is defined relative to the third digit.", "s": "Snell 9e, Ch. 9, intrinsic hand muscles."}, {"q": "Clawing reflects imbalance between intrinsic and extrinsic muscle actions, so its appearance depends on lesion level and whether FDP remains functional.", "a": true, "e": "Intrinsic paralysis permits MCP hyperextension and IP flexion; proximal ulnar lesions may weaken FDP and reduce clawing.", "s": "Snell 9e, Ch. 9, hand and ulnar nerve."}, {"q": "The first dorsal web space is a useful sensory test point for the superficial radial nerve, but its preservation does not prove that all radial-innervated extensor muscles are intact.", "a": true, "e": "Sensory and motor branches may be differentially affected; superficial radial is sensory, PIN motor.", "s": "Snell 9e, Ch. 9, radial nerve."}, {"q": "A proximal musculocutaneous lesion can combine weakness of anterior arm muscles with sensory change over the lateral forearm, its terminal cutaneous continuation.", "a": true, "e": "The musculocutaneous nerve supplies coracobrachialis, biceps and brachialis, then continues as lateral cutaneous nerve of forearm.", "s": "Snell 9e, Ch. 9, anterior arm."}, {"q": "A lesion proximal to the origin of the lateral cutaneous nerve of forearm can cause sensory loss over the lateral forearm even when the distal cutaneous branch itself is structurally intact.", "a": true, "e": "The cutaneous nerve is the continuation of musculocutaneous nerve; a proximal lesion interrupts its axons.", "s": "Snell 9e, Ch. 9, musculocutaneous nerve."}, {"q": "Lumbricals arise from FDP tendons and insert into extensor expansions, enabling MCP flexion with IP extension despite their association with the flexor apparatus.", "a": true, "e": "Their line of pull through extensor expansions explains their combined action.", "s": "Snell 9e, Ch. 9, intrinsic hand muscles."}, {"q": "The long thoracic nerve descends on the lateral thoracic wall to reach serratus anterior, making it vulnerable during procedures involving the axilla or lateral chest wall.", "a": true, "e": "Its superficial course on serratus anterior places it at risk in axillary surgery.", "s": "Snell 9e, Ch. 9, axilla and scapular region."}, {"q": "Supraspinatus tendon dysfunction may impair initiation of abduction despite preserved axillary-nerve supply to deltoid, because the two muscles do not contribute identically throughout the movement.", "a": true, "e": "Supraspinatus initiates abduction and stabilises the humeral head; deltoid is the major abductor through the midrange.", "s": "Snell 9e, Ch. 9, shoulder movements."}, {"q": "A surgical-neck fracture may injure axillary nerve and posterior circumflex humeral vessels, whereas a midshaft fracture more directly threatens radial nerve and profunda brachii.", "a": true, "e": "These structures have different close relationships to the proximal and shaft regions of humerus.", "s": "Snell 9e, Ch. 9, scapular region and arm."}, {"q": "A medial epicondyle fracture primarily endangers radial nerve because it passes posterior to that epicondyle before entering the forearm.", "a": false, "e": "The ulnar nerve passes posterior to medial epicondyle.", "s": "Snell 9e, Ch. 9, elbow."}, {"q": "The extensor indicis and extensor digiti minimi provide independent extension to selected digits, so tendon-level deficits may be selective even when common extensor function persists.", "a": true, "e": "These muscles contribute independent tendons to index and little fingers.", "s": "Snell 9e, Ch. 9, posterior forearm."}, {"q": "The axillary vein is a constituent of the axillary sheath, so any sheath injury necessarily produces venous obstruction alongside arterial and plexus injury.", "a": false, "e": "The axillary vein lies outside the sheath.", "s": "Snell 9e, Ch. 9, axilla."}, {"q": "A radial lesion in the arm may spare substantial triceps function depending on its level, because motor branches to the heads arise at different points along the nerve's course.", "a": true, "e": "Triceps branches arise proximal to and around the radial groove; lesion level determines which are affected.", "s": "Snell 9e, Ch. 9, radial nerve."}, {"q": "A distal ulnar lesion may produce more obvious clawing than a proximal lesion because the proximal lesion can also weaken FDP and reduce unopposed distal interphalangeal flexion.", "a": true, "e": "This is the ulnar paradox: distal lesions may produce more pronounced clawing.", "s": "Snell 9e, Ch. 9, ulnar nerve; clinical anatomy."}, {"q": "Median digital nerves supply palmar lateral digits and dorsal distal phalangeal regions, so the cutaneous map cannot be inferred from the palm alone.", "a": true, "e": "Median nerve supplies palmar lateral 3½ digits and dorsal distal phalanges/nail beds; radial supplies much of dorsolateral hand.", "s": "Snell 9e, Ch. 9, cutaneous innervation."}, {"q": "The hand's abduction-adduction axis passes through the middle finger, not the body's midline; the same digit therefore provides the reference for both palmar and dorsal interossei.", "a": true, "e": "Dorsal interossei abduct from the middle finger; palmar interossei adduct toward it.", "s": "Snell 9e, Ch. 9, intrinsic hand muscles."}, {"q": "A deep ulnar branch lesion may weaken finger abduction and adduction while sparing much of the palmar digital sensation carried by the superficial branch.", "a": true, "e": "Interossei are deep-branch motor targets; digital sensation is superficial-branch territory.", "s": "Snell 9e, Ch. 9, ulnar nerve."}, {"q": "The dorsal scapular and long thoracic nerves arise from the cords, so a lesion restricted to the roots cannot affect rhomboid or serratus anterior function.", "a": false, "e": "Dorsal scapular and long thoracic nerves arise proximally from roots; root lesions can affect them.", "s": "Snell 9e, Ch. 9, brachial plexus."}, {"q": "The radial nerve lies medial to the median nerve in the cubital fossa and divides beneath the bicipital aponeurosis into superficial and deep branches.", "a": false, "e": "The radial nerve lies laterally in the fossa, near brachioradialis, and divides into superficial and deep branches.", "s": "Snell 9e, Ch. 9, cubital fossa."}, {"q": "The recurrent median branch passes through the carpal tunnel with the flexor tendons and is therefore invariably compressed in carpal tunnel syndrome.", "a": false, "e": "It usually arises distal to the retinaculum and has variable courses; it is not a standard tunnel content.", "s": "Snell 9e, Ch. 9, median nerve in hand."}, {"q": "The radial pulse is commonly palpated lateral to flexor carpi radialis tendon, but this superficial segment is not a content of the carpal tunnel.", "a": true, "e": "Radial artery is superficial at the wrist and enters the snuffbox; it does not pass through carpal tunnel.", "s": "Snell 9e, Ch. 9, surface anatomy."}, {"q": "The upper limb's function depends on coordinated scapular, glenohumeral, elbow, radioulnar, wrist and hand mechanics; an isolated normal joint range does not establish normal integrated limb function.", "a": true, "e": "Movement chains depend on several articulations and muscle groups acting together.", "s": "Snell 9e, Ch. 9, integrated upper-limb anatomy."}, {"q": "The bicipital aponeurosis lies deep to the median cubital vein and superficial to the brachial artery, providing a protective layer during venepuncture.", "a": true, "e": "The aponeurosis separates the superficial vein from deeper artery and nerve structures.", "s": "Snell 9e, Ch. 9, cubital fossa, pp. 369–370, 378–379."}, {"q": "The ulnar nerve passes behind medial epicondyle and then between the heads of flexor carpi ulnaris, creating two anatomically distinct sites at which it may be compromised.", "a": true, "e": "The nerve is vulnerable at the cubital tunnel and between FCU heads.", "s": "Snell 9e, Ch. 9, ulnar nerve."}, {"q": "Flexor carpi ulnaris is median-innervated and inserts on the second metacarpal, producing wrist flexion with radial deviation.", "a": false, "e": "FCU is ulnar-innervated and inserts on pisiform, hook of hamate and base of fifth metacarpal; it flexes/adducts wrist.", "s": "Snell 9e, Ch. 9, anterior forearm."}, {"q": "The median nerve may be compressed at the wrist while its forearm motor branches remain intact, producing a pattern that differs fundamentally from a proximal median neuropathy.", "a": true, "e": "Distal lesions spare branches already given off to forearm muscles.", "s": "Snell 9e, Ch. 9, median nerve."}, {"q": "FDS tendons split around FDP tendons at the level of the proximal phalanges; FDS inserts on middle phalanges while FDP reaches distal phalanges.", "a": true, "e": "This arrangement permits the profundus tendon to pass through the superficialis split (Camper's chiasm).", "s": "Snell 9e, Ch. 9, flexor tendons."}, {"q": "The brachial artery normally divides at the surgical neck of the humerus before entering the cubital fossa.", "a": false, "e": "It usually divides in the cubital fossa near the neck of the radius.", "s": "Snell 9e, Ch. 9, arteries of arm and forearm."}, {"q": "Pectoralis minor forms the posterior axillary wall and is the principal abductor of the humerus, so its paralysis reproduces a deltoid lesion.", "a": false, "e": "Pectoralis minor forms part of anterior wall and acts on scapula; deltoid abducts humerus.", "s": "Snell 9e, Ch. 9, axilla."}, {"q": "Both palmar and dorsal interossei contribute to MCP flexion and IP extension through their attachments to the extensor expansions.", "a": true, "e": "Interossei act with lumbricals on the extensor mechanism.", "s": "Snell 9e, Ch. 9, intrinsic hand muscles."}, {"q": "Palmar and dorsal cutaneous branches of the ulnar nerve arise proximal to Guyon's canal, so a canal lesion may spare some dorsal sensation while affecting palmar digital territories.", "a": true, "e": "Branch origins proximal to the lesion are spared; exact pattern depends on lesion location.", "s": "Snell 9e, Ch. 9, ulnar nerve."}, {"q": "Supratrochlear nodes lie above the lateral epicondyle and primarily receive lymph from the thumb and lateral forearm.", "a": false, "e": "They lie above the medial epicondyle and receive lymph from medial hand/forearm territories.", "s": "Snell 9e, Ch. 9, lymphatics, p. 371."}, {"q": "The posterior interosseous nerve is the continuation of the deep radial branch after it traverses supinator and supplies most extensor muscles distal to the elbow.", "a": true, "e": "The deep branch becomes PIN after passing through supinator.", "s": "Snell 9e, Ch. 9, radial nerve."}, {"q": "The median nerve lies lateral to the biceps tendon in the cubital fossa, while the brachial artery is medial to the nerve.", "a": false, "e": "The classic lateral-to-medial order is biceps tendon, brachial artery, median nerve.", "s": "Snell 9e, Ch. 9, cubital fossa, pp. 378–379."}, {"q": "A lesion distal to the radial nerve's division can paralyse every wrist extensor, including extensor carpi radialis longus, which receives its branch only from the posterior interosseous nerve.", "a": false, "e": "ECRL is supplied before the deep branch division; it may be spared in PIN lesions.", "s": "Snell 9e, Ch. 9, radial nerve."}, {"q": "The cephalic vein forms the lateral boundary of the anatomical snuffbox, while the radial artery forms its medial boundary.", "a": false, "e": "APL/EPB tendons form the lateral boundary, EPL the medial boundary; radial artery lies in the floor.", "s": "Snell 9e, Ch. 9, anatomical snuffbox."}, {"q": "An anterior interosseous lesion abolishes sensation over the lateral three and a half digits because it is the terminal sensory continuation of the median nerve.", "a": false, "e": "AIN is motor; digital sensation is carried by median nerve digital branches.", "s": "Snell 9e, Ch. 9, median nerve."}, {"q": "Palmaris longus is variable or absent in some individuals and has a relatively minor functional contribution, making it a common tendon graft donor.", "a": true, "e": "Its absence is common and function is modest compared with other flexors.", "s": "Snell 9e, Ch. 9, anterior forearm."}, {"q": "The deep palmar arch is more superficial and distal than the superficial palmar arch, and lies directly beneath the palmar aponeurosis.", "a": false, "e": "The deep arch is more proximal and deep; the superficial arch is more distal and superficial.", "s": "Snell 9e, Ch. 9, palm and arterial arches."}, {"q": "A lesion of the upper trunk can affect deltoid through the axillary nerve and supraspinatus through the suprascapular nerve, despite these nerves arising at different levels of plexus organisation.", "a": true, "e": "Both carry substantial C5–C6 fibres; the suprascapular nerve arises from upper trunk and axillary from posterior cord.", "s": "Snell 9e, Ch. 9, brachial plexus."}, {"q": "Digital neurovascular bundles accompany flexor tendon-sheath structures, so a small penetrating wound may injure important deep components despite a limited skin defect.", "a": true, "e": "Digital nerves and arteries course along the sides of digits with tendon sheaths nearby.", "s": "Snell 9e, Ch. 9, fingers and hand."}, {"q": "The lunate is the most frequently fractured carpal bone, and the median nerve runs through its substance.", "a": false, "e": "Scaphoid is most commonly fractured; lunate dislocation can threaten the median nerve by compression, but the nerve is not within the bone.", "s": "Snell 9e, Ch. 9, carpal bones."}, {"q": "All three heads of triceps cross the shoulder joint, so shoulder dislocation can stretch their common origin and directly abolish elbow extension.", "a": false, "e": "Only long head crosses shoulder; other heads arise from posterior humerus.", "s": "Snell 9e, Ch. 9, posterior arm."}, {"q": "Full shoulder elevation depends on scapulothoracic movement as well as glenohumeral movement, so scapular fixation can limit elevation despite a structurally intact glenohumeral joint.", "a": true, "e": "Scapular upward rotation contributes to full overhead movement.", "s": "Snell 9e, Ch. 9, shoulder girdle."}, {"q": "The pisiform lies within the tendon of flexor carpi ulnaris and serves as a sesamoid, but is excluded from the radiocarpal articulation.", "a": true, "e": "It articulates with triquetrum and does not directly articulate with radius.", "s": "Snell 9e, Ch. 9, carpal bones."}, {"q": "The superficial radial branch is sensory, whereas its deep branch traverses supinator and continues as the posterior interosseous nerve to supply extensor muscles.", "a": true, "e": "The radial nerve divides into superficial sensory and deep motor branches.", "s": "Snell 9e, Ch. 9, radial nerve."}, {"q": "The median nerve enters the forearm posterior to pronator teres and passes through the carpal tunnel superficial to the flexor tendons.", "a": false, "e": "It passes between pronator teres heads and through the carpal tunnel deep to the flexor retinaculum with the flexor tendons.", "s": "Snell 9e, Ch. 9, forearm and wrist."}, {"q": "The rotator cuff reinforces the shoulder capsule anteriorly, superiorly and posteriorly, while its relative deficiency inferiorly contributes to a predictable region of capsular vulnerability.", "a": true, "e": "The cuff consists of subscapularis, supraspinatus, infraspinatus and teres minor; it is deficient inferiorly.", "s": "Snell 9e, Ch. 9, shoulder joint, p. 360."}, {"q": "A basilic vein catheter is often directed centrally because the basilic vein maintains a relatively direct course toward axillary vein, whereas the cephalic vein may present an acute angle at its termination.", "a": true, "e": "Snell notes the basilic route is more direct; cephalic may join axillary at a right angle and be difficult to negotiate.", "s": "Snell 9e, Ch. 9, venous catheterisation."}, {"q": "A median nerve lesion's sensory and motor deficits need not have identical borders because its branches to skin and muscles arise at different levels and follow distinct routes.", "a": true, "e": "Motor and sensory branch anatomy differs along the nerve; partial lesions can produce non-identical patterns.", "s": "Snell 9e, Ch. 9, median nerve."}, {"q": "A lesion of the upper trunk may affect suprascapular-nerve function, whereas a lesion confined to the posterior cord is distal to the origin of that nerve.", "a": true, "e": "The suprascapular nerve arises from the upper trunk before cord formation. The posterior cord lesion does not directly interrupt its origin.", "s": "Snell 9e, Ch. 9, brachial plexus."}, {"q": "The cephalic and basilic veins normally unite in the cubital fossa to form the axillary vein, while the brachial veins drain independently into the subclavian vein.", "a": false, "e": "The median cubital vein commonly connects cephalic and basilic; basilic joins brachial veins to form axillary vein near teres major.", "s": "Snell 9e, Ch. 9, veins of upper limb."}];let order=[],answers={},score=0;const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function render(){order=shuffle([...BANK.keys()]);answers={};score=0;$('score').textContent='0';$('answered').textContent='0';$('result').style.display='none';const root=$('questions');root.innerHTML='';
order.forEach((bankIndex,index)=>{const item=BANK[bankIndex],card=document.createElement('article');card.className='question';const head=document.createElement('div');head.className='qhead';const num=document.createElement('div');num.className='num';num.textContent=index+1;const q=document.createElement('div');q.className='qtext';q.textContent=item.q;head.append(num,q);card.append(head);
const choices=document.createElement('div');choices.className='choices';['TRUE','FALSE'].forEach(value=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=value;b.addEventListener('click',()=>answer(bankIndex,value==='TRUE',choices,feedback));choices.append(b);});
const feedback=document.createElement('div');feedback.className='feedback';card.append(choices,feedback);root.append(card);});}
function answer(i,value,choices,feedback){if(Object.prototype.hasOwnProperty.call(answers,i))return;answers[i]=value;const item=BANK[i],correct=value===item.a;score+=correct?1:-1;
[...choices.children].forEach(b=>{b.disabled=true;if((b.textContent==='TRUE')===value)b.classList.add('selected',value?'true':'false');});
feedback.className='feedback show '+(correct?'correct':'incorrect');const verdict=document.createElement('strong');verdict.textContent=correct?'Correct · +1':'Incorrect · −1';const explanation=document.createElement('span');explanation.textContent=item.e;const source=document.createElement('span');source.className='source';source.textContent='Reference: '+item.s;feedback.append(verdict,explanation,source);
$('score').textContent=score;$('answered').textContent=Object.keys(answers).length;if(Object.keys(answers).length===BANK.length){$('finalScore').textContent=(score>0?'+':'')+score;$('summary').textContent='100 questions answered. Correct answers earn +1; incorrect answers earn −1; unanswered questions earn 0.';$('result').style.display='block';}}
$('retake').addEventListener('click',render);$('again').addEventListener('click',()=>{render();window.scrollTo({top:0,behavior:'smooth'});});render();
