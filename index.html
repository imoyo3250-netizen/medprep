<!DOCTYPE html>
<html>
<head>
    <title>MedStudy Hub</title>

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#07111f;
            color:white;
            text-align:center;
        }

        header{
            padding:60px 20px;
        }

        h1{
            font-size:48px;
            margin-bottom:10px;
        }

        p{
            color:#aebdcc;
            font-size:18px;
        }

        .subjects{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
            padding:20px;
        }

        .card{
            width:250px;
            padding:30px;
            background:#0d1d2d;
            border:1px solid #294155;
            border-radius:15px;
        }

        .card h2{
            margin-top:0;
        }

        .button{
            display:inline-block;
            margin-top:15px;
            padding:12px 20px;
            background:#2388b8;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }
    </style>
</head>

<body>

<header>
    <h1>🧠 MedStudy Hub</h1>
    <p>Master Medicine One Question at a Time</p>
</header>

<div class="subjects">

    <div class="card">
        <h2>🫀 Physiology</h2>
        <p>Ganong-based question bank</p>
        <a href="#physiology" class="button">View Tests</a>
    </div>

    <div class="card">
        <h2>🦴 Anatomy</h2>
        <p>Anatomy question bank</p>
        <a href="#anatomy" class="button">View Tests</a>
    </div>

    <div class="card">
        <h2>🧬 Embryology</h2>
        <p>Embryology question bank</p>
        <a href="#embryology" class="button">View Tests</a>
    </div>

</div>

</body>
</html>
