nong's figure identifies cerebellar Purkinje cells as multipolar cells with extensive dendritic branching."], ["At rest, neuronal membranes are usually more permeable to Na+ than to K+.", false, "Resting membrane permeability is greater to K+ than to Na+."]]], ["Resting membrane potential", [["A membrane potential requires both an unequal distribution of charge and selective membrane permeability to ions.", true, "Ganong describes both conditions as necessary for development of a membrane potential."], ["The resting membrane potential is normally positioned much nearer the Na+ equilibrium potential than the K+ equilibrium potential.", false, "Because resting K+ permeability is greater, the resting potential is closer to EK."], ["The Na+/K+ ATPase is unnecessary for maintaining the concentration gradients that underlie neuronal electrical activity.", false, "The pump maintains the Na+ and K+ concentration gradients by moving them against their electrochemical gradients."], ["During normal pump operation, three Na+ ions are moved into the cell while two K+ ions leave it.", false, "The pump moves three Na+ out and two K+ into the cell."], ["Because resting Na+ permeability is relatively low, changing extracellular Na+ generally has less effect on resting membrane potential than changing extracellular K+.", true, "Ganong explicitly contrasts the effects of extracellular Na+ and K+ changes."]]], ["Ion gradients & Na⁺-K⁺ ATPase", [["An increase in extracellular K+ tends to make the resting membrane potential more positive rather than more negative.", true, "Hyperkalemia shifts the resting membrane potential toward a less negative value."], ["Hypokalemia moves the resting membrane potential toward threshold by making it less negative.", false, "Hypokalemia tends to hyperpolarize the membrane, making it more negative."], ["The rapid upstroke of the action potential is associated with increased Na+ conductance following opening of voltage-gated Na+ channels.", true, "This is esistance.", false, "C fibers are unmyelinated and have much slower conduction velocities than Aδ fibers."], ["Group III sensory fibers correspond approximately to Aδ fibers.", true, "Ganong's numerical classification associates group III with Aδ fibers."], ["Group IV sensory fibers are myelinated fibers that correspond to the fastest proprioceptive afferents.", false, "Group IV corresponds to unmyelinated C fibers."], ["Fast anterograde axonal transport is substantially faster than slow anterograde transport.", true, "Ganong gives about 400 mm/day for fast transport versus about 0.5–10 mm/day for slow transport."], ["Retrograde transport moves materials from the soma toward the nerve terminal.", false, "Retrograde transport moves from the nerve ending toward the cell body."]]], ["Conduction of action potentials", [["Kinesin is associated with anterograde transport, whereas dynein is associated with retrograde transport.", true, "The axonal transport figure associates these motor proteins with those directions."], ["Axonal transport is confined to proteins synthesized inside the axon itself.", false, "Most protein synthesis occurs primarily in the soma, and axonal transport carries proteins and other materials along the axon."], ["Microglia are described as immune-related cells of the CNS.", true, "Ganong describes microglia as part of the CNS immune system."], ["Astrocytes are the principal cells responsible for forming myelin around CNS axons.", false, "Oligodendrocytes form CNS myelin."], ["Astrocytic processes can contact both capillaries and neurons.", true, "The figure and text describe astrocyte end-feet/processes contacting capillaries and neuronal elements."]]], ["Saltatory conduction", [["An oligodendrocyte normally forms myelin around only one axon segment, in the same way as a Schwann cell.", false, "Oligodendrocytes can extend processes to myelinate multiple axons; Schwann cells form individual myelin segments."], ["Schwann cells provide myelin in the peripheral nervous system.", true, "This is stated in Ganong."], ["Loss of myelin can impair conduction because the insulating properties needed for efficient current flow are reduced.", true, "Demyelination causes leakage of current and impaired conduction."], ["Multiple sclerosis is presented as an autoimmune demyelinating disease of the CNS.", true, "Ganong's clinical box describes MS as an autoimmune disease affecting CNS myelin."], ["Guillain-Barré syndrome is primarily a disorder of oligodendrocyte myelin in the CNS.", false, "Ganong associates Guillain-Barré syndrome with peripheral demyelination."]]], ["Mammalian nerve-fiber types", [["Local anesthetics enhance nerve conduction by increasing the opening probability of voltage-gated Na+ channels.", false, "Local anesthetics block voltage-gated Na+ channels and reduce excitability/conduction."], ["The smallest unmyelinated nociceptive fibers are among the most sensitive to local anesthetic blockade.", true, "Ganong states that unmyelinated C fibers are most sensitive, followed by sequentially larger fibers."], ["Motor nerve fibers are generally more resistant to local anesthetic blockade than small nociceptive fibers.", true, "The clinical box states that larger motor fibers are more resistant."], ["Neurotrophins are involved only in neuronal signaling and have no role in neuronal survival or growth.", false, "Ganong describes neurotrophins as necessary for neuronal survival and growth."], ["NGF is listed with TrkA, whereas BDNF is listed with TrkB.", true, "This is shown in the neurotrophin table."]]], ["Sensory-fiber classification", [["NT-3 is associated with TrkC and can also act through TrkB.", true, "Ganong's table lists TrkC and TrkB for NT-3."], ["The p75 neurotrophin receptor invariably produces survival and growth whenever it is activated.", false, "Ganong notes that p75 can produce effects opposite to usual growth-promoting actions and can promote apoptosis."], ["Peripheral axonal regeneration is generally more favorable than regeneration after CNS injury.", true, "Ganong explains that the peripheral environment is more supportive of regeneration."], ["After peripheral nerve injury, the distal axon remains fully functional while only the proximal stump changes.", false, "The distal axon degenerates; regeneration involves growth from the proximal stump."], ["Schwann cells can provide growth-promoting signals that help guide regenerating peripheral axons.", true, "This mechanism is described in the axonal-regeneration clinical box."]]], ["Axonal transport", [["CNS injury can create an environment less favorable for axonal regeneration, including astrocytic proliferation and inhibitory factors.", true, "Ganong describes these changes after CNS injury."], ["A moderate depolarization caused by hyperkalemia can bring the resting membrane potential closer to threshold.", true, "This is the physiological basis described in the hyperkalemia section."], ["A rise in extracellular K+ invariably increases excitability without any possibility of conduction failure.", false, "Severe hyperkalemia can impair excitability and conduction."], ["The Na+/K+ ATPase directly produces the millisecond-scale rising phase of each action potential.", false, "The rapid action-potential upstroke is produced by voltage-gated Na+ channels; the pump maintains ion gradients."], ["The Na+/K+ ATPase helps prevent gradual dissipation of Na+ and K+ concentration gradients over time.", true, "Ganong explains that the pump prevents the gradients from dissipating."]]], ["Glia", [["At rest, K+ leakage contributes importantly to the negative resting membrane potential.", true, "Greater resting K+ permeability is a major determinant of the resting potential."], ["The membrane potential of a resting neuron is normally around +70 mV.", false, "Ganong gives a resting membrane potential of about −70 mV."], ["The initial segment contains a high concentration of voltage-gated Na+ channels and is important for action-potential initiation.", true, "The chapter notes high Na+ channel density in the initial segment."], ["Nodes of Ranvier contain fewer voltage-gated Na+ channels than the soma.", false, "Na+ channels are highly concentrated at nodes; the chapter gives lower densities in the cell body than in the initial segment/nodes."], ["Myelin allows depolarization to travel rapidly from one node to the next while the action potential is regenerated at the nodes.", true, "This describes saltatory conduction."]]], ["Myelin-forming cells", [["The action potential is normally conducted in only one direction because the membrane behind the wave is refractory.", true, "The refractory state behind the action potential prevents immediate re-excitation."], ["A stronger-than-threshold stimulus normally increases the amplitude of an individual action potential in an all-or-none fiber.", false, "Action-potential amplitude is not graded with stimulus strength once threshold is reached."], ["The firing level and resting membrane potential refer to exactly the same membrane voltage.", false, "The firing level/threshold is more positive than the resting membrane potential."], ["A depolarizing stimulus that remains below threshold can still produce an electrotonic response.", true, "Subthreshold stimuli produce local/electrotonic potentials."], ["C fibers are the largest and fastest fibers listed in Ganong's mammalian fiber table.", false, "C fibers are among the smallest and slowest, and are unmyelinated."]]], ["Local anesthetics", [["Aβ fibers conduct faster than Aδ fibers.", true, "Ganong's table gives higher conduction velocities for Aβ fibers than Aδ fibers."], ["B fibers conduct more rapidly than C fibers because B fibers are myelinated.", true, "B fibers are myelinated and have higher conduction velocities than unmyelinated C fibers."], ["Retrograde axonal transport can return material taken up at nerve endings toward the cell body.", true, "Ganong describes this function of retrograde transport."], ["Slow anterograde transport occurs at approximately 400 mm/day.", false, "About 400 mm/day is given for fast anterograde transport; slow transport is about 0.5–10 mm/day."], ["Microglia increase in number and become activated in several CNS injuries and diseases.", true, "Ganong describes microglial activation/proliferation in injury and disease."]]], ["Neurotrophins", [["Astrocytes are characterized in the CNS by star-like shapes and processes that contact capillaries and neurons.", true, "This description appears in the glia section."], ["Schwann cells form myelin around CNS axons, whereas oligodendrocytes form myelin around peripheral axons.", false, "The relationship is the reverse: oligodendrocytes in CNS, Schwann cells in PNS."], ["A local anesthetic can block action-potential conduction without necessarily damaging the nerve itself.", true, "The clinical box describes local/regional anesthesia as temporary interruption of neural traffic."], ["Ester- and amide-linked compounds are the two major categories of local anesthetics described.", true, "Ganong gives these two categories."], ["NGF is described as being transported retrogradely from nerve endings toward the cell body.", true, "Ganong describes NGF uptake at nerve endings followed by retrograde transport."]]], ["Demyelination & regeneration", [["Neurotrophins act through high-affinity tyrosine kinase-associated Trk receptors.", true, "The text states that established neurotrophins bind high-affinity Trk receptors."], ["A p75 receptor activated in the absence of a neurotrophin can never promote apoptosis.", false, "Ganong states that activation of p75 in the absence of neurotrophin can promote apoptosis."], ["Peripheral nerve regeneration is aided by growth-promoting signals associated with Schwann cells.", true, "This is described in the axonal-regeneration section."], ["Central nervous system axons generally regenerate more readily than peripheral axons after injury.", false, "Ganong s function shuffle(arr){
  arr=[...arr];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function shuffleBalanced(groups){
  const out=[];
  let lastAnswerByPos=[null,null,null,null,null];

  groups.forEach(q=>{
    const statements=q[1].map(s=>[...s]);
    let best=null,bestPenalty=Infinity;

    for(let attempt=0;attempt<80;attempt++){
      const candidate=shuffle(statements.map(s=>[...s]));
      let penalty=0;

      candidate.forEach((s,i)=>{
        if(lastAnswerByPos[i]!==null && lastAnswerByPos[i]===s[1]) penalty+=6;
      });

      for(let i=1;i<candidate.length;i++){
        if(candidate[i][1]===candidate[i-1][1]) penalty+=1;
      }

      if(penalty<bestPenalty){bestPenalty=penalty;best=candidate;}
      if(penalty===0)break;
    }

    best.forEach((s,i)=>lastAnswerByPos[i]=s[1]);
    out.push([q[0],best]);
  });
  return out;
}

const randomizedQuestions=shuffleBalanced(shuffle(questions));
const letters=["A","B","C","D","E"];
let score=0,answered=0;
const test=document.getElementById("test");

function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

randomizedQuestions.forEach((q,qi)=>{
  const card=document.createElement("div");
  card.className="card";
  let html=`<h2>Q${qi+1}. ${escapeHtml(q[0])}</h2>`;

  q[1].forEach((s,si)=>{
    html+=`<div class="statement" id="s${qi}_${si}">
      <p><b>${letters[si]})</b> ${escapeHtml(s[0])}</p>
      <button onclick="answer(${qi},${si},true)">TRUE</button>
      <button onclick="answer(${qi},${si},false)">FALSE</button>
      <div class="explanation" id="e${qi}_${si}" style="display:none"></div>
    </div>`;
  });

  card.innerHTML=html;
  test.appendChild(card);
});

function answer(qi,si,value){
  const s=randomizedQuestions[qi][1][si];
  const box=document.getElementById(`s${qi}_${si}`);
  box.querySelectorAll("button").forEach(b=>b.disabled=true);

  const correct=value===s[1];
  score+=correct?1:-1;
  answered++;

  const e=document.getElementById(`e${qi}_${si}`);
  e.style.display="block";
  e.innerHTML=correct
    ? `<span class="correct">Correct: +1</span> — ${s[1]?"TRUE":"FALSE"}. ${escapeHtml(s[2])}`
    : `<span class="wrong">Wrong: −1</span> — Correct answer: ${s[1]?"TRUE":"FALSE"}. ${escapeHtml(s[2])}`;

  document.getElementById("score").textContent=`Score: ${score} / 100`;
  document.getElementById("answered").textContent=`Answered: ${answered} / 100`;

  if(answered===100){
    document.getElementById("final").innerHTML=
      `<div class="card"><h2>FINAL SCORE: ${score} / 100</h2>
      <p>Percentage: ${score}%</p>
      <p class="small">100 deliberately reworded TRUE/FALSE statements based on the supplied Ganong Chapter 4 pages. The section and statement positions were randomized for this attempt.</p>
      <button class="reset" onclick="location.reload()">Retake — New Random Order</button></div>`;
    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  }
}
</script>
