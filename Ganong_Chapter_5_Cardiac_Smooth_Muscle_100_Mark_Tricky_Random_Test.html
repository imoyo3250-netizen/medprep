<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Ganong Chapter 5 — Cardiac & Smooth Muscle — 100 Mark Test</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef2f6;color:#111;margin:0;padding:12px}
.container{max-width:850px;margin:auto}
header{background:#202a36;color:white;padding:18px;border-radius:14px;margin-bottom:12px}
h1{font-size:25px;margin:0 0 8px}
.subtitle{font-size:14px;opacity:.9}
#bar{position:sticky;top:8px;z-index:10;background:white;padding:12px;border-radius:12px;box-shadow:0 2px 10px #cbd2d9;margin-bottom:12px}
#score{font-weight:bold}
.card{background:white;padding:16px;margin:13px 0;border-radius:13px;box-shadow:0 2px 8px #d4d9df}

.statement{border-top:1px solid #e5e7eb;padding:12px 0}
.statement p{margin:0 0 9px;line-height:1.42}

.wrong{color:#b00020;font-weight:bold}
.explanation{margin-top:8px;padding:9px;border-radius:8px;background:#f2f4f6;font-size:14px;line-height:1.4}
#final .card{border:2px solid #222}
.small{font-size:12px;color:#555}

</style>
</head>
<body>
<div class="container">
<header>
<h1>Ganong Chapter 5 — Cardiac & Smooth Muscle</h1>
<div class="subtitle">100-mark TRUE/FALSE test • Deliberately reworded from the supplied continuation pages</div>
</header>
<div id="bar">
<b id="score">Score: 0 / 100</b> &nbsp;|&nbsp;
<span id="answered">Answered: 0 / 100</span>
<br>
<span class="small">Correct = +1 • Wrong = −1 • Sections/statements are shuffled each time the test starts.</span>
</div>
<div id="test"></div>
<div id="final"></div>
</div>
<script>
const sourceSections = [["Body mechanics", [["Muscle attachments are arranged so that many muscles begin contraction at or near their resting length.", true, "Ganong notes that many muscle attachments are arranged so muscles are at or near resting length when contraction begins."], ["When a muscle crosses more than one joint, movement at one joint can compensate for movement at another and limit overall muscle shortening.", true, "Ganong describes this arrangement as allowing relatively little shortening during contraction."], ["Near-isometric contractions of this type are useful because they can permit maximal tension to be developed per contraction.", true, "The text states that nearly isometric contractions permit maximal tension per contraction."], ["The hamstrings shorten across both the hip and knee whenever the thigh and leg are moved simultaneously in the same direction.", false, "Flexion of the thigh at the hip lengthens the hamstrings across the hip and can compensate for shortening across the knee."], ["Momentum and balance are irrelevant to efficient body movement because muscular force alone determines movement economy.", false, "Ganong says momentum and balance are integrated into movement to permit maximal motion with minimal muscular exertion."]]], ["Walking mechanics", [["During walking, each limb alternates between a support phase with the foot on the ground and a swing phase with the foot off the ground.", true, "Ganong describes these two phases for each limb."], ["The support phases of the two legs overlap, producing two periods of double support during each walking cycle.", true, "The text specifically describes two periods of double support per cycle."], ["The leg muscles remain continuously maximally active throughout every step, which explains why prolonged walking rapidly causes fatigue.", false, "The text says the muscles are active for only a fraction of each step, contributing to relatively little fatigue."], ["A comfortable walking speed in young adults is approximately 80 m/min.", true, "Ganong gives about 80 m/min as the comfortable pace."], ["Walking faster or slower than the comfortable rate described requires less energy because either change reduces power output.", false, "The text states that walking more rapidly or more slowly takes more energy."]]], ["Cardiac muscle morphology", [["Cardiac muscle has striations and Z-lines resembling those found in skeletal muscle.", true, "Ganong states that the striations and Z-lines in cardiac muscle are similar to those in skeletal muscle."], ["Cardiac muscle contains numerous elongated mitochondria located close to the muscle fibrils.", true, "The text describes large numbers of elongated mitochondria in close contact with the fibrils."], ["Cardiac muscle fibers lack any specialized structure at their cell-to-cell junctions.", false, "The membranes form specialized intercalated disks at the junctions."], ["Intercalated disks provide strong cell-to-cell cohesion so contraction can be transmitted from one cardiac fiber to the next.", true, "This is one of the functions attributed to intercalated disks."], ["The T system of mammalian cardiac muscle is located at the A-I junction, exactly as in mammalian skeletal muscle.", false, "Ganong states that the cardiac T system is located at the Z-lines, rather than the A-I junction."]]], ["Intercalated disks and syncytium", [["Intercalated disks occur at Z-lines and are formed where adjacent cardiac cell membranes meet through extensive folds.", true, "Ganong describes these folded cell-membrane junctions at Z-lines as intercalated disks."], ["The cell membranes alongside an intercalated disk can fuse over considerable distances and form low-resistance pathways for excitation.", true, "The text describes membrane fusion alongside the disks and low-resistance bridges for excitation."], ["Cardiac muscle behaves functionally like a syncytium even though there are no protoplasmic bridges between individual cells.", true, "This distinction is explicitly made in the source."], ["Intercalated disks prevent excitation from spreading from one cardiac fiber to another.", false, "They permit the spread of excitation from one fiber to another."], ["The functional syncytium of cardiac muscle requires direct protoplasmic continuity between every cardiomyocyte.", false, "The source says cardiac muscle functions as a syncytium despite the absence of protoplasmic bridges."]]], ["Cardiac resting membrane potential", [["The resting membrane potential of an individual mammalian cardiac muscle cell is approximately −90 mV.", true, "The supplied page gives approximately −90 mV."], ["Stimulation of a cardiac muscle cell produces an action potential responsible for initiating contraction.", true, "The source directly connects stimulation, action potentials, and initiation of contraction."], ["The action potential of a typical ventricular cardiomyocyte is essentially identical in duration to that of skeletal muscle.", false, "The cardiac action potential has an extended plateau and much longer duration."], ["Ventricular cardiac action potentials show rapid depolarization followed by an extended recovery period.", true, "This is the pattern described in the figure and accompanying text."], ["Cardiac action potentials normally last only about 2 ms because their plateau phase is absent.", false, "The source contrasts the prolonged cardiac action potential with the much shorter skeletal muscle action potential."]]], ["Cardiac action-potential phases", [["Phase 0 of the cardiac action potential is associated with rapid depolarization.", true, "Figure 5-16 identifies phase 0 as depolarization."], ["Phase 1 includes an initial rapid repolarization following the upstroke.", true, "The figure labels phase 1 as initial rapid repolarization."], ["Phase 2 is the plateau phase of the cardiac action potential.", true, "Figure 5-16 labels phase 2 as the plateau."], ["Phase 3 represents the final rapid repolarization toward the baseline membrane potential.", true, "The figure identifies phase 3 as late rapid repolarization."], ["Phase 4 is the plateau phase and is maintained by persistent inward Na+ current.", false, "Phase 4 is the baseline period; the plateau is phase 2."]]], ["Cardiac ionic currents", [["The rapid depolarization of cardiac muscle involves opening of voltage-gated Na+ channels.", true, "The source states that phase 0 is due to opening of voltage-gated Na+ channels."], ["Initial rapid repolarization is associated with closure of Na+ channels and opening of one type of K+ channel.", true, "This is the mechanism described for phase 1."], ["The plateau phase is associated with a slower, prolonged inward Ca2+ current through voltage-gated Ca2+ channels.", true, "Ganong attributes the plateau to delayed Ca2+ entry through T- and L-type channels."], ["Final repolarization is produced by increased Ca2+ influx together with closure of K+ channels.", false, "Final repolarization involves closure of Ca2+ channels and increased K+ efflux through various K+ channels."], ["The slower L-type Ca2+ current contributes importantly to the cardiac action-potential plateau.", true, "The source states that the current is mostly due to opening of slower L-type Ca2+ channels."]]], ["Cardiac refractory period", [["During phases 0 to 2 and approximately the first half of phase 3, cardiac muscle is in its absolute refractory period.", true, "The source gives this approximate interval and endpoint at about −50 mV during repolarization."], ["A cardiac muscle cell becomes fully excitable again during the absolute refractory period.", false, "During the absolute refractory period, the cardiac myocyte cannot be excited again."], ["Cardiac muscle remains relatively refractory until phase 4.", true, "The text states that relative refractoriness persists until phase 4."], ["The prolonged refractory period prevents tetanus of the type seen in skeletal muscle.", true, "This is explicitly stated."], ["Cardiac muscle is normally tetanized during sustained high-frequency stimulation in the same way as skeletal muscle.", false, "Ganong states that tetanus of the skeletal-muscle type cannot occur in cardiac muscle."]]], ["Cardiac contractile response", [["The cardiac contractile response begins shortly after depolarization starts.", true, "The source states that the contractile response begins just after the start of depolarization."], ["The cardiac contractile response lasts about 1.5 times as long as the action potential.", true, "This duration is given in the text."], ["In cardiac excitation-contraction coupling, extracellular Ca2+ entry can trigger Ca2+-induced Ca2+ release from the sarcoplasmic reticulum.", true, "The source describes Ca2+-induced Ca2+ release through RyR."], ["Cardiac contraction depends only on Ca2+ released from the sarcoplasmic reticulum and does not require extracellular Ca2+ entry.", false, "Extracellular Ca2+ influx through voltage-sensitive/DHPR or voltage-gated channels triggers SR Ca2+ release."], ["Because there is net Ca2+ influx during cardiac activation, plasma-membrane Ca2+ ATPases and the Na+/Ca2+ exchanger contribute to recovery of cytosolic Ca2+.", true, "This role is specifically described in the source."]]], ["Long QT syndrome", [["Long QT syndrome is characterized by prolongation of the QT interval on an electrocardiogram.", true, "That is the definition given in the clinical box."], ["Long QT syndrome can lead to irregular heartbeats, fainting, seizures, cardiac arrest, or death.", true, "These complications are listed in the clinical box."], ["Most mutation-based cases of long QT syndrome are attributed to mutations in cardiac-expressed voltage-gated K+ channel genes such as KCNQ1 or KCNH2.", true, "The clinical box attributes about 90% of mutation-based cases to these K+ channel genes."], ["Only K+ channel mutations have been associated with long QT syndrome; Na+ and Ca2+ channel genes are not implicated.", false, "The source also identifies cardiac Na+ and Ca2+ channel genes such as SCN5A and CACNA1C."], ["Patients with long QT syndrome should avoid drugs that prolong the QT interval or reduce serum K+ or Mg2+ levels.", true, "This is stated in the therapeutic highlights."]]], ["Cardiac muscle metabolism", [["Cardiac muscle is relatively slow and has a relatively low ATPase activity compared with rapidly contracting skeletal muscle.", true, "The supplied text describes cardiac muscle as generally slow with relatively low ATPase activity."], ["Cardiac muscle fibers depend heavily on oxidative metabolism and therefore require a continuous oxygen supply.", true, "The source explicitly emphasizes oxidative metabolism and continuous O2 supply."], ["Normally, less than 1% of the total energy liberated by the heart is provided by anaerobic metabolism.", true, "This value is stated in the text."], ["Under total anaerobic conditions, the contribution of anaerobic metabolism to cardiac energy production can rise to nearly 10%.", true, "The source states that it may increase to nearly 10% under total anaerobic conditions."], ["The heart normally obtains all of its energy from carbohydrates and none from fatty acids.", false, "The source gives approximate contributions from carbohydrates, ketones/amino acids, and fatty acids."]]], ["Cardiac length-tension relationship", [["The relation between initial cardiac muscle fiber length and total tension resembles the relation in skeletal muscle.", true, "The source makes this comparison."], ["In the heart, the initial fiber length is determined by the degree of filling of the heart.", true, "The source relates initial fiber length to degree of filling."], ["The pressure developed in a ventricle is proportional to the initial fiber length at the end of diastole.", true, "This relationship is stated in the discussion of the Frank-Starling law."], ["As ventricular filling increases beyond the point of maximal developed tension, developed tension necessarily continues to rise indefinitely.", false, "The source states that developed tension reaches a maximum and then tends to decrease."], ["The decrease in developed tension at excessive stretch is explained simply by a loss of actin-myosin cross-bridges.", false, "The source notes that the decrease does not mean a decrease in the number of cross-bridges; excessively stretched fibers may have greater cross-bridge interaction."]]], ["Catecholamines and cardiac relaxation", [["Catecholamines increase cardiac muscle force and this increase is associated with a change in muscle length.", true, "The source describes a positive inotropic effect of catecholamines associated with a change in muscle length."], ["The positive inotropic effect of catecholamines is mediated through β1-adrenergic receptors, cyclic AMP, and effects on Ca2+ homeostasis.", true, "These mechanisms are described in the supplied text."], ["Atrial myocytes contain β2-adrenergic receptors whose inotropic effect is smaller than that in ventricular muscle.", true, "The source describes β2 receptors in atrial myocytes and a smaller maximal inotropic effect."], ["Protein kinase A decreases phosphorylation of voltage-gated Ca2+ channels, thereby slowing Ca2+ entry.", false, "Protein kinase A increases phosphorylation of voltage-gated Ca2+ channels, increasing Ca2+ entry."], ["Increased Ca2+ uptake into the sarcoplasmic reticulum accelerates relaxation and permits adequate diastolic filling.", true, "The source links increased SR Ca2+ uptake with accelerated relaxation and cardiac rate."]]], ["Smooth muscle morphology", [["Smooth muscle lacks the visible cross-striations characteristic of skeletal and cardiac muscle.", true, "The source states that smooth muscle lacks visible cross-striations."], ["Actin and myosin are present in smooth muscle, but they are not arranged in the regular arrays seen in skeletal muscle.", true, "This is directly described in the morphology section."], ["Smooth muscle contains dense bodies associated with α-actinin and actin filaments.", true, "The source describes dense bodies in the cytoplasm and attached to the cell membrane, bound by α-actinin to actin."], ["Smooth muscle contains troponin as its principal Ca2+-binding regulatory protein.", false, "Ganong states that smooth muscle lacks troponin and instead uses calmodulin-dependent regulation."], ["Smooth muscle cells are generally less dependent on glycolysis than skeletal muscle because their mitochondria are more extensive.", false, "The source states that smooth muscle has fewer mitochondria and depends, to a large extent, on glycolysis."]]], ["Unitary and multiunit smooth muscle", [["Smooth muscle can be divided into single-unit (unitary or visceral) and multiunit types.", true, "The source gives this classification."], ["Unitary smooth muscle commonly occurs in hollow organs and has low-resistance gap junctions between individual cells.", true, "This is described in the types section."], ["Unitary smooth muscle functions as a functional syncytium because excitation can spread through gap junctions.", true, "The source explicitly describes this feature."], ["Multiunit smooth muscle is characterized by extensive gap junction coupling between all of its cells.", false, "Multiunit smooth muscle has fewer or no gap junctions between individual units, allowing more discrete control."], ["The contractions of multiunit smooth muscle tend to be more discrete, fine, and localized than those of unitary smooth muscle.", true, "This distinction is stated in the source."]]], ["Smooth muscle electrical activity", [["Unitary smooth muscle has an unstable membrane potential and shows continuous, irregular contractions independent of nervous stimulation.", true, "The source characterizes unitary smooth muscle this way."], ["Smooth muscle has a fixed, unchanging resting membrane potential that is identical in every tissue.", false, "The membrane potential has no true resting value and varies with tissue activity."], ["Smooth muscle membrane potentials may range from about −20 to −65 mV during relatively quiescent periods.", true, "This range is given in the source."], ["Smooth muscle action potentials can include slow waves and spikes that sometimes overshoot zero potential.", true, "The electrical activity section describes slow waves and spikes, sometimes with overshoot."], ["The action potential of every smooth muscle tissue lasts less than 10 ms.", false, "Some tissues have action potentials lasting about 50 ms, while others have prolonged plateaus."]]], ["Smooth muscle molecular contraction", [["An increase in cytosolic Ca2+ plays a prominent role in initiating smooth muscle contraction.", true, "The source states this directly."], ["Smooth muscle Ca2+ can enter through voltage-gated or ligand-gated channels in the plasma membrane.", true, "These are listed as possible sources of increased cytosolic Ca2+."], ["Ca2+ can also be released from intracellular stores through ryanodine receptors and IP3 receptors.", true, "The source identifies both RyR and IP3R as release channels."], ["Troponin is the protein that binds Ca2+ and directly activates myosin in smooth muscle.", false, "Smooth muscle lacks troponin; Ca2+ binds calmodulin."], ["Ca2+-calmodulin activates myosin light chain kinase, which phosphorylates myosin and increases its ATPase activity.", true, "This sequence is shown in Figure 5-19 and described in the text."]]], ["Smooth muscle relaxation", [["Myosin light chain phosphatase contributes to smooth muscle relaxation by dephosphorylating myosin.", true, "The source identifies myosin light chain phosphatase as part of relaxation."], ["Dephosphorylation of myosin always causes immediate complete relaxation of smooth muscle.", false, "The source notes that dephosphorylation does not necessarily lead to relaxation because latch bridges and other mechanisms can sustain contraction."], ["Latch bridges can allow smooth muscle to maintain contraction with relatively little energy expenditure.", true, "The text describes sustained contraction through latch mechanisms with little energy expenditure."], ["Smooth muscle relaxation can occur when the Ca2+-calmodulin complex dissociates or other mechanisms inhibit Ca2+-calmodulin action.", true, "This is described in the relaxation sequence."], ["Smooth muscle relaxation is entirely dependent on removal of extracellular Ca2+ from the surrounding fluid.", false, "Relaxation involves intracellular regulatory mechanisms including Ca2+-calmodulin dissociation and phosphatase activity."]]], ["Nitric oxide and smooth muscle", [["Endothelial cells can release a relaxing substance known as endothelium-derived relaxing factor.", true, "The source describes EDRF released by endothelial cells."], ["Endothelium-derived relaxing factor was later identified as nitric oxide.", true, "The text states this explicitly."], ["Nitric oxide produced in endothelial cells can diffuse into adjacent smooth muscle.", true, "NO is described as freely diffusing into smooth muscle."], ["In smooth muscle, nitric oxide directly activates soluble guanylyl cyclase and promotes formation of cyclic GMP.", true, "This is the pathway described in the relaxation section."], ["Nitric oxide relaxes smooth muscle primarily by directly phosphorylating myosin light chains.", false, "The source describes NO acting through soluble guanylyl cyclase and cGMP."]]], ["Nerve supply and smooth muscle force/plasticity", [["The nerve supply to unitary smooth muscle mainly modifies activity rather than initiating all activity.", true, "The source states that the function of autonomic nerve supply is to modify activity because unitary muscle has spontaneous activity."], ["Stimulation of one autonomic division usually increases smooth muscle activity while stimulation of the other decreases it, although the response can vary by organ.", true, "Ganong describes this general pattern and notes organ-specific reversals."], ["Smooth muscle can generate similar force per cross-sectional area to skeletal muscle despite having about 20% of its myosin content and a much lower ATP use.", true, "These comparisons are given in the force-generation section."], ["Smooth muscle contractions are generally faster than skeletal muscle contractions because smooth muscle uses less ATP.", false, "The source states that smooth muscle contractions are noticeably slower."], ["Plasticity means that after smooth muscle is stretched and held at a greater length, tension can gradually fall, making a single resting length difficult to assign.", true, "This is the definition and consequence of plasticity described in the source."]]]];
let sections = JSON.parse(JSON.stringify(sourceSections));
let score=0, answered=0, total=100, locked=new Set();

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function render(){
  score=0; answered=0; locked=new Set();
  document.getElementById('score').textContent='Score: 0 / 100';
  document.getElementById('answered').textContent='Answered: 0 / 100';
  document.getElementById('final').innerHTML='';
  sections=shuffle(sections);
  sections.forEach(s=>shuffle(s[1]));
  const test=document.getElementById('test');
  test.innerHTML='';
  let n=0;
  sections.forEach((section,si)=>{
    const card=document.createElement('div');
    card.className='card';
    const h=document.createElement('h2');
    h.textContent=(si+1)+'. '+section[0];
    card.appendChild(h);
    section[1].forEach((q,qi)=>{
      n++;
      const id=n;
      const box=document.createElement('div');
      box.className='statement';
      box.innerHTML='<p><b>'+String.fromCharCode(65+qi)+'.</b> '+q[0]+'</p>';
      const t=document.createElement('button');
      t.textContent='TRUE';
      const f=document.createElement('button');
      f.textContent='FALSE';
      const result=document.createElement('div');
      t.onclick=()=>answer(id,true,q,t,f,result);
      f.onclick=()=>answer(id,false,q,t,f,result);
      box.appendChild(t); box.appendChild(f); box.appendChild(result);
      card.appendChild(box);
    });
    test.appendChild(card);
  });
}

function answer(id,choice,q,t,f,result){
  if(locked.has(id)) return;
  locked.add(id);
  const correct=q[1];
  const ok=choice===correct;
  score += ok ? 1 : -1;
  answered++;
  t.disabled=true; f.disabled=true;
  result.className=ok?'correct':'wrong';
  result.textContent=ok?'✓ Correct (+1)':'✗ Wrong (−1)';
  const exp=document.createElement('div');
  exp.className='explanation';
  exp.innerHTML='<b>Explanation:</b> '+q[2]+'<br><b>Correct answer:</b> '+(correct?'TRUE':'FALSE');
  result.appendChild(exp);
  document.getElementById('score').textContent='Score: '+score+' / 100';
  document.getElementById('answered').textContent='Answered: '+answered+' / 100';
  if(answered===total){
    const final=document.getElementById('final');
    final.innerHTML='<div class="card"><h2>Final Score</h2><p><b>'+score+' / 100</b></p><button class="reset" onclick="render()">Retake / New Random Order</button></div>';
  }
}

render();
</script>
</body>
