<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganong Chapter 6 — Synaptic & Junctional Transmission — 100 Mark Test</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef2f6;color:#111;margin:0;padding:12px}
.container{max-width:850px;margin:auto}
header{background:#202a36;color:white;padding:18px;border-radius:14px;margin-bottom:12px}
h1{font-size:25px;margin:0 0 8px}
.subtitle{font-size:14px;opacity:.9}
#bar{position:sticky;top:8px;z-index:10;background:white;padding:12px;border-radius:12px;box-shadow:0 2px 10px #cbd2d9;margin-bottom:12px}
#score{font-weight:bold}
.card{background:white;padding:16px;margin:13px 0;border-radius:13px;box-shadow:0 2px 8px #d4d9df}
h2{font-size:18px;margin:0 0 12px}
.statement{border-top:1px solid #e5e7eb;padding:12px 0}
.statement p{margin:0 0 9px;line-height:1.42}
button{padding:9px 13px;margin:3px;border-radius:8px;border:1px solid #555;background:white;font-size:15px}
button:hover{background:#edf1f5}
button:disabled{opacity:.5}
.correct{color:#087a35;font-weight:bold}
.wrong{color:#b00020;font-weight:bold}
.explanation{margin-top:8px;padding:9px;border-radius:8px;background:#f2f4f6;font-size:14px;line-height:1.4}
#final .card{border:2px solid #222}
.small{font-size:12px;color:#555}
.reset{background:#202a36;color:white;border-color:#202a36}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Ganong Chapter 6 — Synaptic & Junctional Transmission</h1>
<div class="subtitle">100-mark TRUE/FALSE test • Deliberately reworded from the supplied Chapter 6 pages</div>
</header>
<div id="bar">
<b id="score">Score: 0 / 100</b> &nbsp;|&nbsp;
<span id="answered">Answered: 0 / 100</span>
<br>
<span class="small">Correct = +1 • Wrong = −1 • Sections/statements are shuffled each time the test starts.</span>
</div>
<div id="test"></div>
<div id="final"></div>
</div>
<script>
const sourceSections=[["Synapse basics & organization", [["A synapse is the region where the axon or another part of a presynaptic neuron terminates on the dendrite, soma, or axon of a postsynaptic neuron.", true, "Ganong defines the synapse as the region where the presynaptic neuron terminates on the dendrite, soma, or axon of another neuron."], ["Neuron-to-neuron communication occurs exclusively through chemical synapses.", false, "Ganong states that neuron-to-neuron communication occurs across either chemical or electrical synapses."], ["When a neuron terminates on skeletal muscle, the connection is called a neuromuscular junction rather than a synapse.", true, "The introduction distinguishes the neuromuscular junction from the usual neuron-to-neuron synapse."], ["Most synaptic transmission is chemical, which is why the chapter focuses heavily on chemical neurotransmission.", true, "The source states that most synaptic transmission is chemical."], ["The contacts between autonomic neurons and smooth muscle or glands are more specialized than those between neurons and skeletal muscle.", false, "Ganong states that these autonomic contacts are less specialized and more diffuse than neuron-to-skeletal-muscle contacts."]]], ["Synaptic anatomy", [["Presynaptic terminals may end on dendrites, including dendritic spines, on the soma, or on the axon of a postsynaptic neuron.", true, "The source describes axodendritic, axosomatic, and axoaxonic synapses."], ["Most presynaptic terminals are restricted to the cell body and never contact dendrites.", false, "Most synapses occur on dendrites, and some occur on the soma or axon."], ["A typical chemical synaptic cleft is approximately 20–40 nm wide.", true, "The source gives a synaptic cleft width of 20–40 nm."], ["The postsynaptic density contains membrane proteins including neurotransmitter receptors and signaling proteins.", true, "Ganong describes the postsynaptic density as an electron-dense membrane specialization containing receptor and signaling proteins."], ["Synapses are completely static structures whose number and complexity do not change with experience.", false, "The source says synapses are dynamic and can increase or decrease in complexity and number with use and experience."]]], ["Dendrites & dendritic spines", [["Dendrites receive electrical signals from other neurons, process them, and transfer information toward the soma.", true, "This is the function assigned to dendrites in the source."], ["Dendritic spines can change or disappear over relatively short periods such as minutes and hours.", true, "Ganong states that dendritic spines can appear, change, and disappear over minutes and hours."], ["Protein synthesis relevant to changes in dendritic spines occurs exclusively inside the nucleus.", false, "Although synthesis occurs mainly in the soma, mRNA can migrate into dendrites and proteins can be produced in dendritic spines."], ["Changes in dendritic spines are implicated in motivation, learning, and long-term memory.", true, "The source explicitly links dendritic-spine changes with these functions."], ["An extensive dendritic tree with many presynaptic knobs necessarily produces only inhibitory activity.", false, "The source describes extensive dendritic input as allowing interplay between inhibitory and excitatory activity."]]], ["Synaptic vesicles & neurotransmitter storage", [["Small clear synaptic vesicles contain transmitters such as acetylcholine, glycine, GABA, or glutamate.", true, "Ganong lists these transmitters in small clear vesicles."], ["Small dense-core vesicles are associated with catecholamines, whereas large dense-core vesicles contain neuropeptides.", true, "This is the classification given in the source."], ["Neuropeptides in large dense-core vesicles are synthesized in the axon terminal and never in the neuronal cell body.", false, "The source says neuropeptides are synthesized in the neuronal cell body and transported along the axon by fast axoplasmic transport."], ["Small synaptic vesicles are located near the synaptic cleft and can release their contents rapidly.", true, "The source contrasts their rapid release with the distribution of large dense-core vesicles."], ["Large dense-core vesicles release their contents only at the active zones immediately adjacent to the synaptic cleft.", false, "They are distributed throughout some terminals and can release neuropeptides from all parts of the terminal."]]], ["Synaptic vesicle cycle", [["An arriving action potential causes Ca2+ influx at the nerve ending, which triggers vesicle fusion and exocytosis.", true, "The source describes Ca2+ influx as the trigger for fusion and exocytosis."], ["Synaptic vesicles can undergo endocytosis and be refilled for another cycle of neurotransmitter release.", true, "This cycle is illustrated in Figure 6-3."], ["In kiss-and-run discharge, the vesicle fully collapses into the plasma membrane and must be rebuilt from scratch before reuse.", false, "In kiss-and-run discharge, the vesicle releases through a transient pore and remains largely intact inside the cell."], ["Clathrin coating is involved in the endocytic recycling of synaptic vesicle membrane.", true, "The source states that clathrin coating facilitates endocytosis."], ["The synaptic vesicle cycle stops permanently after one round of exocytosis.", false, "Vesicles are recycled and can enter another release cycle."]]], ["Vesicle docking & fusion proteins", [["Synaptobrevin in the vesicle membrane interacts with syntaxin and SNAPs in the plasma membrane during vesicle fusion.", true, "Figure 6-4 and its description identify these proteins."], ["NSF and SNAPs are involved in the protein machinery responsible for synaptic vesicle docking and fusion.", true, "The source identifies NSF, SNAPs, and SNARE proteins in the fusion complex."], ["Rab GTPases participate in regulation of the multiprotein complex involved in vesicle docking and fusion.", true, "The figure labels Rab3 and the text notes GTPase regulation."], ["Synaptic vesicle fusion occurs independently of any membrane proteins and depends only on ATP diffusion.", false, "The source emphasizes a multiprotein fusion complex including SNARE-related proteins and NSF/SNAPs."], ["Neurexin-neuroligin interactions contribute to holding synapses together and to synaptic specificity.", true, "The source describes these presynaptic/postsynaptic adhesion interactions."]]], ["Neurotoxins", [["Tetanus and botulinum toxins are produced by Clostridium species and can disrupt neurotransmitter release.", true, "Clinical Box 6-1 describes toxins from Clostridium tetani and Clostridium botulinum."], ["Tetanus toxin binds irreversibly to the presynaptic membrane at the neuromuscular junction and remains there without transport.", false, "The source says tetanus toxin is taken up by presynaptic terminals and transported retrogradely to the cell body and spinal cord."], ["Tetanus toxin ultimately increases motor-neuron activity by blocking release of glycine and GABA from inhibitory interneurons.", true, "This is the mechanism described for tetanus-associated spastic paralysis."], ["Botulinum toxin can cause paralysis by blocking acetylcholine release at the neuromuscular junction.", true, "The source states that botulinum toxin B cleaves synaptobrevin and prevents acetylcholine release."], ["All botulinum toxin types are described as harmless because they do not affect neurotransmitter release.", false, "Several botulinum toxin types are described as toxic to humans and disrupt transmitter release."]]], ["Fast EPSPs & IPSPs", [["A fast EPSP can result when an excitatory transmitter opens Na+ or Ca2+ channels in the postsynaptic membrane.", true, "The source states that excitatory transmitters open Na+ or Ca2+ channels, producing inward current."], ["A fast EPSP represents a large depolarization that spreads uniformly across the entire neuron from one synaptic knob.", false, "The source says the current is localized and one synaptic knob produces a small EPSP."], ["A fast IPSP can be produced by a localized increase in Cl− conductance.", true, "Ganong gives increased Cl− transport/conductance as a mechanism for a fast IPSP."], ["The excitability of the postsynaptic neuron is increased during an IPSP.", false, "An IPSP decreases the neuron's excitability."], ["Fast EPSPs and IPSPs reach their peak roughly 1–1.5 ms after the stimulus in the described circuit.", true, "The source gives this approximate timing."]]], ["Slow postsynaptic potentials", [["Slow EPSPs are generally associated with decreased K+ conductance.", true, "The source states that slow EPSPs are generally due to decreased K+ conductance."], ["Slow IPSPs are generally associated with increased K+ conductance.", true, "This is the corresponding mechanism given in the source."], ["Slow EPSPs and IPSPs have shorter latencies and briefer durations than fast postsynaptic potentials.", false, "The source states that slow potentials have latencies of about 100–500 ms and durations of several seconds."], ["Slow postsynaptic potentials occur in autonomic ganglia, cardiac and smooth muscle, and cortical neurons.", true, "These locations are listed in the source."], ["Slow postsynaptic potentials are restricted exclusively to the neuromuscular junction.", false, "The source describes them in several neural and muscular tissues."]]], ["Temporal & spatial summation", [["Temporal summation depends on the timing of successive postsynaptic potentials generated by the same presynaptic neuron.", true, "The source explains that the time constant determines how successive EPSPs from one presynaptic neuron summate."], ["Spatial summation involves inputs from different presynaptic neurons whose depolarizations spread toward the trigger zone.", true, "The source describes spatial summation using inputs from two presynaptic neurons."], ["A long membrane time constant makes temporal summation less likely because the first EPSP decays more rapidly.", false, "A longer time constant allows the first potential to persist and therefore favors temporal summation."], ["A long length constant allows depolarization to spread with less decrement and favors spatial summation.", true, "This is the relationship described in Figure 6-7."], ["Temporal and spatial summation can never be sufficient to trigger an action potential.", false, "The source shows that summed EPSPs can reach threshold and induce an action potential."]]], ["Generation of an action potential", [["The postsynaptic neuron integrates excitatory and inhibitory inputs through fluctuating membrane potentials.", true, "Ganong describes the postsynaptic neuron as an integrator of hyperpolarizing and depolarizing potentials."], ["An action potential occurs when the integrated depolarization reaches threshold voltage.", true, "The source states this directly."], ["In most neurons, including motor neurons, the initial segment of the axon has the lowest threshold for action-potential production.", true, "This is stated in the section on action-potential generation."], ["The initial segment is highly specialized for synaptic input because it contains the highest concentration of synaptic knobs.", false, "The source emphasizes that it is specialized for action-potential generation; synaptic input is received elsewhere."], ["The axon initial segment is electrically distant from all synaptic inputs and therefore cannot be influenced by them.", false, "It is influenced by excitatory and inhibitory synaptic currents that spread to the trigger zone."]]], ["Electrical synapses", [["Electrical synapses contain gap junctions that form low-resistance pathways between presynaptic and postsynaptic neurons.", true, "The source describes gap junctions as low-resistance bridges."], ["Ions can pass relatively easily from one neuron to the next through electrical synapses.", true, "This is the defining feature stated in the chapter summary."], ["Electrical synapses necessarily require neurotransmitter release into a synaptic cleft.", false, "Electrical synapses transmit through gap junctions rather than chemical neurotransmitter release."], ["Transmission through an electrical synapse can be faster than chemical transmission.", true, "The source notes the low-resistance pathway and contrasts it with the synaptic delay of chemical transmission."], ["The one-way gate at chemical synapses is unnecessary for orderly neural function.", false, "Ganong notes that the one-way gate at a synapse is necessary for orderly neural function."]]], ["Postsynaptic inhibition", [["Postsynaptic inhibition occurs when an inhibitory transmitter such as glycine or GABA produces an IPSP in the postsynaptic neuron.", true, "This is the definition given in the section."], ["Reciprocal inhibition in the stretch reflex involves an inhibitory interneuron acting on motor neurons supplying the antagonist muscle.", true, "Figure 6-5 shows this arrangement."], ["After-hyperpolarization following repeated firing can make a spinal neuron less excitable.", true, "The source describes after-hyperpolarization as reducing excitability."], ["Postsynaptic inhibition can occur only before an action potential has ever been generated in the neuron.", false, "It can occur during ongoing neural activity and can be produced by inhibitory transmitters."], ["Direct postsynaptic inhibition is necessarily caused by previous discharge of the postsynaptic neuron.", false, "The source distinguishes direct inhibition during an IPSP from indirect inhibition due to previous discharge."]]], ["Presynaptic inhibition & facilitation", [["Presynaptic inhibition reduces neurotransmitter release from an excitatory terminal.", true, "The source describes presynaptic inhibition as reducing transmitter release."], ["Presynaptic inhibition can involve axoaxonic synapses onto the excitatory terminal.", true, "Figure 6-8 shows this arrangement."], ["Activation of presynaptic GABA receptors can increase Cl− conductance and reduce excitatory transmitter release.", true, "The source describes GABA-mediated presynaptic inhibition."], ["Opening voltage-gated K+ channels at the presynaptic terminal can increase Ca2+ influx and enhance transmitter release.", false, "K+ efflux decreases Ca2+ influx and therefore reduces transmitter release."], ["Presynaptic facilitation occurs when the presynaptic action potential is prolonged and Ca2+ channels remain open longer.", true, "This mechanism is stated in the source."]]], ["Organization of inhibitory systems", [["A spinal motor neuron can send a recurrent collateral to an inhibitory interneuron that feeds back onto the same and other motor neurons.", true, "Figure 6-10 illustrates this recurrent inhibitory circuit."], ["The inhibitory interneuron in the recurrent spinal motor-neuron circuit is called a Renshaw cell.", true, "The source identifies it as a Renshaw cell."], ["The neurotransmitter released by the Renshaw cell in the described circuit is glycine.", true, "The figure description identifies glycine."], ["Recurrent inhibition is an example of negative feedback that increases motor-neuron activity.", false, "It is negative feedback that reduces motor-neuron activity."], ["Feed-forward inhibition may limit the duration of excitation produced by a given afferent volley.", true, "The source defines feed-forward inhibition in this way."]]], ["Neuromuscular junction", [["At the neuromuscular junction, a motor nerve terminal forms a specialized connection with the motor endplate of a skeletal muscle fiber.", true, "Ganong describes the neuromuscular junction as the specialized region where a motor nerve terminates on skeletal muscle."], ["The motor nerve terminal contains small clear vesicles containing acetylcholine.", true, "The source identifies acetylcholine-containing vesicles in the terminal."], ["The postsynaptic membrane of the motor endplate contains nicotinic cholinergic receptors.", true, "The source identifies nicotinic cholinergic receptors in the motor endplate."], ["Acetylcholine binding to its receptor decreases Na+ and K+ conductance and produces hyperpolarization.", false, "It increases Na+ and K+ conductance; Na+ influx produces the depolarizing endplate potential."], ["A local endplate potential can depolarize adjacent muscle membrane to threshold and initiate propagated action potentials.", true, "This sequence is described in Figure 6-12."]]], ["Sequence at the neuromuscular junction", [["A motor-neuron action potential increases the permeability of the nerve ending to Ca2+.", true, "The source states that the arriving impulse increases Ca2+ permeability."], ["Ca2+ entry triggers exocytosis of acetylcholine-containing synaptic vesicles.", true, "This is the next step in the sequence."], ["Acetylcholine diffuses across the cleft and binds nicotinic cholinergic receptors in the motor endplate.", true, "The source describes this step."], ["The muscle action potential is generated only on the nerve terminal and never spreads along the muscle fiber.", false, "The endplate potential depolarizes adjacent muscle membrane and propagated muscle action potentials travel away in both directions."], ["Acetylcholine is removed from the synaptic cleft by acetylcholinesterase.", true, "The source explicitly states this."]]], ["Quantal release & autonomic junctions", [["A single nerve impulse releases acetylcholine from approximately 60 synaptic vesicles at the neuromuscular junction.", true, "The source gives approximately 60 vesicles per nerve impulse."], ["Each acetylcholine-containing vesicle is described as containing about 10,000 molecules of neurotransmitter.", true, "This value is given in the quantal-release section."], ["Spontaneous release of small acetylcholine quanta produces miniature endplate potentials.", true, "The source describes spontaneous quanta and their miniature endplate potentials."], ["The size of the released quantum varies directly with Mg2+ concentration and inversely with Ca2+ concentration.", false, "The source states that quantum size varies directly with Ca2+ and inversely with Mg2+ at the endplate."], ["Autonomic nerve fibers supplying smooth muscle can have varicosities containing synaptic vesicles rather than one conventional motor endplate.", true, "Figure 6-13 and the text describe varicosities and neuroeffector junctions."]]], ["Myasthenia gravis & Lambert-Eaton syndrome", [["Myasthenia gravis is an autoimmune disease in which skeletal muscles are weak and tire easily.", true, "Clinical Box 6-2 defines myasthenia gravis this way."], ["Myasthenia gravis involves antibodies that block or destroy nicotinic cholinergic receptors.", true, "The source describes antibodies against nicotinic cholinergic receptors."], ["Myasthenia gravis typically becomes stronger with repeated stimulation because transmitter release progressively increases.", false, "The source describes weakness and fatigability, with neuromuscular transmission failing at low transmitter levels during repeated stimulation."], ["Lambert-Eaton myasthenic syndrome is associated with an autoimmune attack against voltage-gated Ca2+ channels in nerve endings.", true, "Clinical Box 6-3 gives this mechanism."], ["Lambert-Eaton syndrome increases normal Ca2+ influx and therefore causes excessive acetylcholine release at rest.", false, "It decreases normal Ca2+ influx and acetylcholine release; repetitive stimulation can improve release and strength."]]], ["Denervation & hypersensitivity", [["Wallerian degeneration occurs distal to an axonal injury and involves degeneration of the axon and myelin sheath.", true, "Figure 6-14 describes orthograde/Wallerian degeneration distal to injury."], ["The cell body of an injured neuron may swell, with the nucleus moving to an eccentric position.", true, "These changes are described in the axonal-injury section."], ["After denervation, skeletal muscle becomes completely insensitive to acetylcholine.", false, "Denervated skeletal muscle becomes extremely sensitive to acetylcholine."], ["Denervation hypersensitivity can involve upregulation of receptors when a chemical messenger is deficient.", true, "The source identifies receptor upregulation as one cause."], ["Denervation hypersensitivity is caused exclusively by increased neurotransmitter reuptake.", false, "Lack of reuptake is one factor; receptor upregulation from messenger deficiency is another."]]]];
let sections=JSON.parse(JSON.stringify(sourceSections));
let score=0,answered=0,total=100,locked=new Set();

function shuffle(a){
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
 return a;
}

function render(){
 score=0;answered=0;locked=new Set();
 document.getElementById('score').textContent='Score: 0 / 100';
 document.getElementById('answered').textContent='Answered: 0 / 100';
 document.getElementById('final').innerHTML='';
 sections=shuffle(sections);
 sections.forEach(s=>shuffle(s[1]));
 const test=document.getElementById('test');test.innerHTML='';
 let n=0;
 sections.forEach((section,si)=>{
  const card=document.createElement('div');card.className='card';
  const h=document.createElement('h2');h.textContent=(si+1)+'. '+section[0];card.appendChild(h);
  section[1].forEach((q,qi)=>{
   n++;const id=n;
   const box=document.createElement('div');box.className='statement';
   box.innerHTML='<p><b>'+String.fromCharCode(65+qi)+'.</b> '+q[0]+'</p>';
   const t=document.createElement('button');t.textContent='TRUE';
   const f=document.createElement('button');f.textContent='FALSE';
   const result=document.createElement('div');
   t.onclick=()=>answer(id,true,q,t,f,result);
   f.onclick=()=>answer(id,false,q,t,f,result);
   box.appendChild(t);box.appendChild(f);box.appendChild(result);card.appendChild(box);
  });
  test.appendChild(card);
 });
}

function answer(id,choice,q,t,f,result){
 if(locked.has(id))return;
 locked.add(id);
 const ok=choice===q[1];score+=ok?1:-1;answered++;
 t.disabled=true;f.disabled=true;
 result.className=ok?'correct':'wrong';
 result.textContent=ok?'✓ Correct (+1)':'✗ Wrong (−1)';
 const exp=document.createElement('div');exp.className='explanation';
 exp.innerHTML='<b>Explanation:</b> '+q[2]+'<br><b>Correct answer:</b> '+(q[1]?'TRUE':'FALSE');
 result.appendChild(exp);
 document.getElementById('score').textContent='Score: '+score+' / 100';
 document.getElementById('answered').textContent='Answered: '+answered+' / 100';
 if(answered===total){
  document.getElementById('final').innerHTML='<div class="card"><h2>Final Score</h2><p><b>'+score+' / 100</b></p><button class="reset" onclick="render()">Retake / New Random Order</button></div>';
 }
}
render();
</script>
</body>
</html>
