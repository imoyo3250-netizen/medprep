name: Generate paper catalogue

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: write

jobs:
catalogue:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Generate catalogue
    run: |
      python3 - <<'PY'
      import json
      from pathlib import Path

      excluded = {
          "index.html",
          "404.html",
          "my_questions.html"
      }

      papers = []

      for path in Path(".").rglob("*"):
          if not path.is_file():
              continue

          if ".git" in path.parts or ".github" in path.parts:
              continue

          if path.suffix.lower() not in (".html", ".pdf"):
              continue

          if path.name.lower() in excluded:
              continue

          papers.append({
              "title": path.stem.replace("_", " ").replace("-", " "),
              "file": path.as_posix(),
              "type": path.suffix.lower()
          })

      papers.sort(key=lambda item: item["title"].lower())

      Path("papers.json").write_text(
          json.dumps(papers, indent=2),
          encoding="utf-8"
      )
      PY

  - name: Save catalogue
    run: |
      git add papers.json
      if ! git diff --cached --quiet; then
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Update paper catalogue"
        git push
      fi
