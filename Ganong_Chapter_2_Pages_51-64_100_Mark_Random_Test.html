ng ENaCs."}, {"n": 29, "statement": "Secondary active transport directly uses ATP at the cotransporter itself.", "answer": false, "explanation": "Secondary active transport uses energy stored in an ion electrochemical gradient rather than direct ATP use by the cotransporter."}, {"n": 30, "statement": "Increasing intracellular Na⁺ increases Na⁺-K⁺ pump activity.", "answer": true, "explanation": "The text states that more Na⁺ is pumped out when intracellular Na⁺ increases."}, {"n": 31, "statement": "Chemical messengers include only amines and amino acids.", "answer": false, "explanation": "The text also lists steroids, polypeptides, lipids, purine nucleotides, and pyrimidine nucleotides."}, {"n": 32, "statement": "Whole-cell recording can record currents from the entire cell.", "answer": true, "explanation": "Ganong states that the whole-cell configuration records whole-cell currents."}, {"n": 33, "statement": "Ligand-receptor complexes can be internalized by receptor-mediated endocytosis.", "answer": true, "explanation": "Internalization by receptor-mediated endocytosis is described as a mechanism of downregulation."}, {"n": 34, "statement": "Aquaporins can also form a central pore that permits ion movement.", "answer": true, "explanation": "The figure caption notes that the subunits can additionally form a central pore capable of ion movement."}, {"n": 35, "statement": "Autocrine communication occurs when a secreted messenger binds receptors on the same cell that secreted it.", "answer": true, "explanation": "This is the definition given."}, {"n": 36, "statement": "Active transport moves substances against their electrochemical gradients and requires energy.", "answer": true, "explanation": "Ganong explicitly contrasts active transport with facilitated diffusion in this way."}, {"n": 37, "statement": "Cells can change the number and properties of receptors in response to physiological conditions.", "answer": true, "explanation": "The receptor section states that rec at exchange one substance for another."}, {"n": 47, "statement": "Posttranslational modification such as phosphorylation can regulate some ion channels.", "answer": true, "explanation": "Figure 2-15 identifies posttranslational modification, such as phosphorylation, as a gating mechanism."}, {"n": 48, "statement": "MAP kinase cascades can transmit receptor signals through sequential phosphorylation of proteins.", "answer": true, "explanation": "The transcription section describes a series of kinases coordinating stepwise phosphorylation."}, {"n": 49, "statement": "Transcytosis is also called vesicular transport or cytopempsis in the supplied text.", "answer": true, "explanation": "Ganong gives these alternative names."}, {"n": 50, "statement": "The β subunit of Na⁺-K⁺ ATPase is a glycoprotein.", "answer": true, "explanation": "Ganong explicitly identifies the β subunit as a glycoprotein."}, {"n": 51, "statement": "Gap-junction communication requires chemical messengers to enter the ECF first.", "answer": false, "explanation": "The text says some messengers move from cell to cell via gap junctions without entering the ECF."}, {"n": 52, "statement": "Excess hormone or neurotransmitter generally causes an increase in the number of active receptors.", "answer": false, "explanation": "Ganong states that excess messenger generally decreases the number of active receptors (downregulation)."}, {"n": 53, "statement": "ENaCs are made from five subunits encoded by five different genes.", "answer": false, "explanation": "Ganong states that ENaCs have three subunits encoded by three different genes."}, {"n": 54, "statement": "The acetylcholine receptor channel contains four subunits forming its pore.", "answer": false, "explanation": "The acetylcholine receptor example is shown with five subunits."}, {"n": 55, "statement": "Na⁺ and K⁺ transport through Na⁺-K⁺ ATPase occur through the β subunit.", "answer": false, "explanation": "The text states that Na⁺ and K⁺ transport occur through the α subunit."}, {"n": 56, "statement": "Channelopathies can affect both excitable and nonexcitable cells.", "answer": true, "explanation": "The clinical box states that channelopathies can affect both types of cells."}, {"n": 57, "statement": "Transcytosis can transport small amounts of protein across endothelial cells.", "answer": true, "explanation": "The text describes protein transport across endothelial cells by endocytosis followed by exocytosis."}, {"n": 58, "statement": "Ligand-gated channels can open when an extracellular ligand binds to the channel.", "answer": true, "explanation": "Ligand binding is given as one mechanism regulating ion-channel gating."}, {"n": 59, "statement": "The Na⁺-K⁺ ATPase is also called the sodium pump or Na⁺-K⁺ pump.", "answer": true, "explanation": "Ganong gives these names for the Na⁺-K⁺ ATPase."}, {"n": 60, "statement": "A cell-attached patch records activity after the membrane patch is pulled completely away from the cell.", "answer": false, "explanation": "The cell-attached patch leaves the membrane patch attached to the cell; pulling it away can produce an inside-out patch."}, {"n": 61, "statement": "Second messengers are extracellular primary messengers that bind directly to receptors.", "answer": false, "explanation": "The text distinguishes extracellular primary/first messengers from intracellular second messengers."}, {"n": 62, "statement": "cAMP, inositol trisphosphate, and DAG are examples of intracellular mediators/second messengers.", "answer": true, "explanation": "These are specifically mentioned in the mechanisms of chemical messenger action."}, {"n": 63, "statement": "Paracrine communication affects only the cell that secreted the messenger.", "answer": false, "explanation": "Paracrine products diffuse through ECF to affect neighboring cells."}, {"n": 64, "statement": "CLC chloride channels are pentamers in humans.", "answer": false, "explanation": "Ganong states that CLC channels are dimers and that the n": "Ganong states that dopamine inhibits the pump by phosphorylation, causing natriuresis."}, {"n": 74, "statement": "The bcr-abl fusion gene encodes a constitutively active tyrosine kinase.", "answer": true, "explanation": "The clinical box describes the bcr-abl product as a constitutively active tyrosine kinase."}, {"n": 75, "statement": "Aldosterone increases the number of Na⁺-K⁺ pumps.", "answer": true, "explanation": "Ganong states that aldosterone increases the number of pumps, although the effect may be secondary."}, {"n": 76, "statement": "Transcytosis involves endocytosis on the capillary side and exocytosis on the interstitial side.", "answer": true, "explanation": "This sequence is stated directly."}, {"n": 77, "statement": "Thyroid hormones increase Na⁺-K⁺ ATPase activity by a genomic action that increases pump formation.", "answer": true, "explanation": "This is the mechanism described in the regulation section."}, {"n": 78, "statement": "Mechanical gating can be produced by stretch, pressure, sound, or shear stress.", "answer": true, "explanation": "Ganong lists mechanical stimuli including stretch, pressure, sound, and shear stress."}, {"n": 79, "statement": "Filtration is movement of fluid through a membrane because of a difference in pressure on the two sides.", "answer": true, "explanation": "This is the definition given in the supplied text."}, {"n": 80, "statement": "Phosphorylation always decreases the activity of a protein.", "answer": false, "explanation": "Ganong states that phosphorylation can alter protein conformation and function; it does not say it always decreases activity."}, {"n": 81, "statement": "Ouabain and related digitalis glycosides inhibit Na⁺-K⁺ ATPase activity.", "answer": true, "explanation": "The text states that pump activity is inhibited by ouabain and related digitalis glycosides."}, {"n": 82, "statement": "The same chemical messenger can function as a neurotransmitter, paracrine mediator, and hormone in different parts let order=[], current=0, score=0, answered=0;

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function render(){

  document.getElementById('app').innerHTML=`
    <div class="card">
      <div class="qn">Question ${current+1}</div>
      <div class="statement">${escapeHtml(q.statement)}</div>
      <button class="t" onclick="answer(true)">TRUE</button>
      <button class="f" onclick="answer(false)">FALSE</button>
      <div id="result" class="expl"></div>
    </div>`;
}
function answer(choice){
  const q=BANK[order[current]];
  const buttons=document.querySelectorAll('button');
  buttons.forEach(b=>b.disabled=true);
  const result=document.getElementById('result');
  const ok=choice===q.answer;
  score += ok ? 1 : -1;
  answered++;
  result.style.display='block';
  result.innerHTML = `<b>${ok?'✓ Correct':'✗ Incorrect'}</b><br>
  <b>Correct answer:</b> ${q.answer?'TRUE':'FALSE'}<br>
  ${escapeHtml(q.explanation)}`;
  document.getElementById('score').textContent=`Score: ${score} / 100`;
  setTimeout(()=>{
    if(current<99){current++;render();window.scrollTo({top:0,behavior:'smooth'});}
    else {
      document.getElementById('app').insertAdjacentHTML('afterbegin',
      `<div class="card"><h2>Test complete</h2><p><b>Final score: ${score} / 100</b></p>
      <p>You answered all 100 statements. Reload/new attempt will randomize the order again.</p></div>`);
    }
  },1200);
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
