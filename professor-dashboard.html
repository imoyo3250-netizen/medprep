<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b70"><title>MedStudy Hub — Professor Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f3f7fc;color:#172b46;font-family:system-ui,Arial,sans-serif}main{max-width:1050px;margin:auto}.panel,.exam{background:#fff;border:1px solid #dce6f2;border-radius:15px;padding:16px;margin:12px 0}h1{font-size:clamp(25px,5vw,36px);margin:4px 0 12px}p{line-height:1.5}.muted{color:#617087}.status{padding:12px;border-radius:9px;background:#edf3fa;margin:12px 0;overflow-wrap:anywhere}.error{background:#fff0ef;color:#b42318}.ok{background:#eaf8f0;color:#18794e}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.meta{font-size:13px;color:#617087;line-height:1.7}button,a.btn{display:inline-block;padding:10px 13px;border:0;border-radius:9px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;margin:4px 4px 4px 0}.primary{background:#1675d1;color:#fff}.secondary{background:#eaf2fc;color:#123b70}.light{background:#f0f3f8;color:#172b46}.exam h2{margin:0 0 8px;font-size:20px}.pill{display:inline-block;background:#edf3fa;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700}
</style></head><body><main>
<header class="panel"><h1>🩺 Professor Dashboard</h1><p id="identity" class="muted">Checking professor access…</p><div class="row"><a class="btn primary" href="./professor-pdf-import.html">＋ Import PDF exam</a><button class="light" onclick="loadExams()">Refresh exams</button><button class="light" onclick="signOut()">Sign out</button></div><div id="status" class="status" role="status">Loading…</div></header>
<section class="panel"><h2>Your exams</h2><p class="muted">Draft exams are not visible to students. Review question type and settings before publishing. Results and secure marking will be connected in a later step.</p><div id="exams"><p class="muted">Loading exams…</p></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://igxmvgcqpcngkzrppqms.supabase.co","sb_publishable_EtS5E2K4bnibaqkZSoTQiQ_SQCUf6-b",{auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let user=null,profile=null;
function say(t,type=""){ $("status").textContent=t;$("status").className="status "+type; }
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function init(){const {data:{session},error}=await db.auth.getSession();if(error||!session){location.replace("./medstudy.html");return;}const p=await db.from("profiles").select("username,role").eq("id",session.user.id).maybeSingle();if(p.error||!p.data||!["admin","professor","administrator"].includes(String(p.data.role||"").toLowerCase())){say("Access denied: professor/admin account required.","error");return;}user=session.user;profile=p.data;$("identity").textContent=(profile.username||user.email)+" · "+profile.role;say("Professor access verified.","ok");await loadExams();}
async function loadExams(){if(!user)return;say("Loading your exams…");const {data,error}=await db.from("exams").select("id,title,subject,topic,question_type,negative_marking,duration_minutes,max_attempts,is_published,created_at").eq("created_by",user.id).order("created_at",{ascending:false});if(error){say("Could not load exams: "+error.message,"error");return;}if(!data.length){$("exams").innerHTML='<p class="muted">No exams found yet. Import a PDF exam to begin.</p>';say("No exams found for this account.");return;}const qs=await Promise.all(data.map(async e=>{const q=await db.from("exam_questions").select("id",{count:"exact",head:true}).eq("exam_id",e.id);return {...e,questionCount:q.count,questionError:q.error?.message};}));$("exams").innerHTML=qs.map(e=>'<article class="exam"><div class="row"><span class="pill">'+(e.is_published?'Published':'Draft')+'</span><span class="pill">'+esc(e.question_type)+'</span></div><h2>'+esc(e.title)+'</h2><div class="meta">Subject: '+esc(e.subject||"—")+' · Topic: '+esc(e.topic||"—")+'<br>Questions: '+(e.questionCount??"unknown")+' · Duration: '+esc(e.duration_minutes)+' min · Attempts allowed: '+esc(e.max_attempts)+'<br>Negative marking: '+(e.negative_marking?'On':'Off')+'<br>Created: '+esc(new Date(e.created_at).toLocaleString())+'<br>Exam ID: '+esc(e.id)+'</div><div class="row">'+(!e.is_published?'<button class="primary" onclick="publishExam(\\''+e.id+'\\')">Publish exam</button>':'<button class="secondary" onclick="unpublishExam(\\''+e.id+'\\')">Return to draft</button>')+'<button class="light" onclick="copyId(\\''+e.id+'\\')">Copy exam ID</button></div></article>').join("");say(qs.length+" exam(s) loaded.","ok");}
async function publishExam(id){if(!confirm("Publish this exam? Students may be able to see it. Confirm that the questions and answer-key security have been reviewed."))return;say("Publishing…");const {error}=await db.from("exams").update({is_published:true}).eq("id",id).eq("created_by",user.id);if(error){say("Publish failed: "+error.message,"error");return;}say("Exam published. Important: only use this after answer-key security and server-side marking have been verified.","ok");await loadExams();}
async function unpublishExam(id){if(!confirm("Return this exam to draft so students cannot start new attempts?"))return;say("Updating exam…");const {error}=await db.from("exams").update({is_published:false}).eq("id",id).eq("created_by",user.id);if(error){say("Update failed: "+error.message,"error");return;}say("Exam returned to draft.","ok");await loadExams();}
async function copyId(id){try{await navigator.clipboard.writeText(id);say("Exam ID copied.","ok");}catch(e){say("Exam ID: "+id);}}
async function signOut(){await db.auth.signOut();location.replace("./medstudy.html");}
init();
</script></body></html>
